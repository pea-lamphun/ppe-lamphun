function Page6StockIn({office,catalog,freq,user}){
  const blank={ itemId:"", subType:"", size:"", qty:1, unit:"" };
  const [date,setDate]=useState(todayISO());
  const [row,setRow]  = useState(blank);
  const [pending,setPending]=useState([]);
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");
  const [busy,setBusy]=useState(false);
  const [mgr,setMgr]=useState(false);

  const items = useMemo(()=>{
    const arr=Object.entries(catalog||{}).map(([id,c])=>({id,...c}));
    return arr.sort((a,b)=>{
      const fa=(freq&&freq[a.id])||0, fb=(freq&&freq[b.id])||0;
      if(fa!==fb) return fb-fa;                               // ใช้บ่อยขึ้นก่อน
      const za=ZONE_IX[a.zone]??9, zb=ZONE_IX[b.zone]??9;
      if(za!==zb) return za-zb;
      return (a.order||0)-(b.order||0);
    });
  },[catalog,freq]);

  const item = items.find(i=>i.id===row.itemId);
  const subTypes = useMemo(()=>{
    if(!item) return [];
    const seeded=SEED_SUBTYPES[item.variant]||[];
    const saved=Object.values(item.subTypes||{});
    return Array.from(new Set([...seeded,...saved]));
  },[item]);

  const unitOptions = useMemo(()=>{
    const used=Object.entries((freq&&freq.__units)||{}).sort((a,b)=>b[1]-a[1]).map(a=>a[0]);
    const head=item&&item.unit?[item.unit]:[];
    return Array.from(new Set([...head,...used,...UNITS]));
  },[item,freq]);

  const pickItem=(o)=>{
    const it=items.find(i=>i.id===o.key);
    setRow({ itemId:o.key, subType:"", size:"", qty:1, unit:(it&&it.unit)||"" });
    setErr("");
  };

  const addRow=()=>{
    setErr("");
    if(!item){ setErr("เลือกชื่อรายการก่อน"); return; }
    if(item.variant!=="none"){
      if(item.variant!=="color" && !row.subType.trim()){ setErr("เลือกหรือพิมพ์ประเภทย่อย"); return; }
      if(!row.size){ setErr("เลือก"+VARIANT_LABEL[item.variant]); return; }
    }
    if(!row.unit.trim()){ setErr("เลือกหรือพิมพ์หน่วย"); return; }
    if(!(row.qty>0)){ setErr("จำนวนต้องมากกว่า 0"); return; }
    const e={ date, itemId:item.id, itemName:item.name, zone:item.zone, variant:item.variant,
              subType:row.subType.trim(), size:row.size, qty:row.qty, unit:row.unit.trim() };
    e.sku=skuOf(e);
    setPending(p=>{
      const ix=p.findIndex(x=>x.sku===e.sku && x.date===e.date && x.unit===e.unit);
      if(ix>=0){ const c=[...p]; c[ix]={...c[ix],qty:c[ix].qty+e.qty}; return c; }
      return [...p,e];
    });
    setRow({...blank, unit:row.unit});
  };

  const commit=async()=>{
    if(!pending.length) return;
    setBusy(true); setErr("");
    try{
      const upd={}; const stockRef=R("offices/"+office.id+"/stock");
      // อ่านของเดิมแล้วบวกเพิ่ม
      const snap=await stockRef.once("value"); const cur=snap.val()||{};
      const freqAdd={};
      pending.forEach(e=>{
        const old=cur[e.sku];
        const q=((old&&old.qty)||0)+e.qty;
        upd["offices/"+office.id+"/stock/"+e.sku]={
          itemId:e.itemId, itemName:e.itemName, zone:e.zone, variant:e.variant,
          subType:e.subType, size:e.size, unit:e.unit, qty:q, updatedAt:nowTs()
        };
        cur[e.sku]={qty:q};
        const lk=R("offices/"+office.id+"/stockIn").push().key;
        upd["offices/"+office.id+"/stockIn/"+lk]={
          date:e.date, sku:e.sku, itemId:e.itemId, itemName:e.itemName,
          subType:e.subType, size:e.size, unit:e.unit, qty:e.qty,
          ts:nowTs(), by:(user&&user.email)||""
        };
        freqAdd[e.itemId]=(freqAdd[e.itemId]||0)+1;
        freqAdd["__units/"+safeKey(e.unit)]=(freqAdd["__units/"+safeKey(e.unit)]||0)+1;
        if(e.subType) upd["catalog/"+e.itemId+"/subTypes/"+safeKey(e.subType)]=e.subType;
      });
      Object.entries(freqAdd).forEach(([k,v])=>{
        const path = k.indexOf("__units/")===0 ? k : k;
        upd["offices/"+office.id+"/freq/"+path]=((freq&&getFreq(freq,path))||0)+v;
      });
      await R("").update(upd);
      setMsg("เพิ่มเข้าคลังแล้ว "+pending.length+" รายการ");
      setPending([]); setTimeout(()=>setMsg(""),4500);
    }catch(e){ setErr("บันทึกไม่สำเร็จ: "+e.message); }
    setBusy(false);
  };

  const opts = items.map(i=>({ key:i.id, label:i.name, search:i.name,
    hint:(ZONES.find(z=>z.id===i.zone)||{}).name+(i.variant!=="none"?" · มีตัวเลือกย่อย":"") }));

  return (<Shell title="เพิ่มรายการเข้าคลัง" sub={office.name}
    right={<button className="btn onplum sm" onClick={()=>go("office/"+office.id+"/items")}><Ic n="back" s={15}/> ย้อนกลับ</button>}
    crumbs={[{t:"หน้าหลัก",to:""},{t:office.name,to:"office/"+office.id},
             {t:"จัดการรายการอุปกรณ์ฯ",to:"office/"+office.id+"/items"},{t:"เพิ่มรายการเข้าคลัง"}]}>

    {msg && <Msg kind="s">{msg}</Msg>}
    {err && <Msg kind="e">{err}</Msg>}

    <div className="card card-p" style={{marginBottom:16}}>
      <div style={{display:"grid",gridTemplateColumns:"150px 1fr",gap:14,alignItems:"start"}} className="rowform">
        <div className="field" style={{margin:0}}>
          <label className="lbl">วันที่</label>
          <input className="inp mono" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
        </div>
        <div className="field" style={{margin:0}}>
          <label className="lbl">ชื่อรายการ <span className="req">*</span></label>
          <Typeahead options={opts} value={item?item.name:""} onPick={pickItem}
            placeholder="พิมพ์ค้นหา เช่น ถุงมือ หมวก รองเท้า…"
            emptyText="ไม่พบรายการ — กด “เพิ่ม/ลบชนิดอุปกรณ์” เพื่อสร้างใหม่"
            render={o=>(<div><div style={{fontWeight:600}}>{o.label}</div><small>{o.hint}</small></div>)}/>
        </div>
      </div>

      {item && <>
        <div className="hr"></div>
        <div className="grid3">
          <div style={{gridColumn:item.variant==="none"?"span 1":"span 2"}}>
            <VariantFields item={item} val={row} onChange={setRow} subTypes={subTypes}/>
            {item.variant==="none" && <div className="hint">รายการนี้ไม่มีตัวเลือกย่อย</div>}
          </div>
          <div>
            <div className="field"><label className="lbl">จำนวน <span className="req">*</span></label>
              <QtyPicker value={row.qty} onChange={q=>setRow({...row,qty:q})}/></div>
            <div className="field"><label className="lbl">หน่วย <span className="req">*</span></label>
              <ComboBox value={row.unit} onChange={u=>setRow({...row,unit:u})}
                options={unitOptions} placeholder="พิมพ์หน่วยใหม่" addLabel="พิมพ์หน่วยใหม่…"/></div>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:4}}>
          <button className="btn" onClick={addRow}><Ic n="plus" s={16}/> เพิ่มรายการนี้</button>
        </div>
      </>}

      <div className="hr"></div>
      <button className="btn neutral sm" onClick={()=>setMgr(true)}>
        <Ic n="wrench" s={13}/> เพิ่ม/ลบชนิดอุปกรณ์ในฐานข้อมูล</button>
    </div>

    <div className="sec-head"><h2>รายการที่รอยืนยัน</h2>
      <span className="chip n">{pending.length} รายการ</span></div>
    <div className="tblwrap">
      {pending.length===0
        ? <Empty icon="box" title="ยังไม่มีรายการรอยืนยัน" desc="กรอกด้านบนแล้วกด “เพิ่มรายการนี้”"/>
        : <table className="t"><thead><tr>
            <th style={{width:100}}>วันที่</th><th>รายการ</th>
            <th style={{width:90}} className="num">จำนวน</th><th style={{width:80}}>หน่วย</th><th style={{width:44}}></th>
          </tr></thead><tbody>
          {pending.map((e,i)=>(<tr key={i}>
            <td className="mono" style={{fontSize:12.5}}>{thDate(e.date)}</td>
            <td><div style={{fontWeight:600}}>{e.itemName}</div>
              {(e.subType||e.size) && <div className="hint">
                {e.subType}{e.subType&&e.size?" · ":""}
                {e.size&&(e.variant==="color"?e.size:"ไซส์ "+e.size)}</div>}</td>
            <td className="num mono" style={{fontWeight:700}}>{e.qty}</td>
            <td style={{fontSize:12.5}}>{e.unit}</td>
            <td><button className="iconbtn danger" onClick={()=>setPending(p=>p.filter((_,ix)=>ix!==i))}>
              <Ic n="trash" s={13}/></button></td>
          </tr>))}
        </tbody></table>}
    </div>

    <div style={{marginTop:16,display:"flex",justifyContent:"flex-end",gap:9}}>
      {pending.length>0 && <button className="btn neutral" onClick={()=>setPending([])}>ล้างทั้งหมด</button>}
      <button className="btn ok" disabled={!pending.length||busy} onClick={commit}>
        {busy&&<span className="spin" style={{borderColor:"rgba(255,255,255,.4)",borderTopColor:"#fff"}}></span>}
        <Ic n="check" s={16}/> ยืนยันเพิ่มรายการ</button>
    </div>

    {mgr && <ItemManager catalog={catalog} onClose={()=>setMgr(false)}/>}
  </Shell>);
}
function getFreq(freq,path){
  if(path.indexOf("__units/")===0) return ((freq.__units)||{})[path.slice(8)]||0;
  return freq[path]||0;
}

/* ── เพิ่ม/ลบชนิดอุปกรณ์ (ฐานข้อมูลกลาง ใช้ร่วมกันทั้ง 10 หน่วยงาน) ── */
function ItemManager({catalog,onClose}){
  const [nm,setNm]=useState(""); const [zone,setZone]=useState("area");
  const [variant,setVariant]=useState("none"); const [unit,setUnit]=useState("อัน");
  const [err,setErr]=useState("");
  const list=useMemo(()=>Object.entries(catalog||{}).map(([id,c])=>({id,...c}))
    .sort((a,b)=>((ZONE_IX[a.zone]??9)-(ZONE_IX[b.zone]??9))||((a.order||0)-(b.order||0))),[catalog]);

  const add=async()=>{
    setErr("");
    if(!nm.trim()){ setErr("กรอกชื่อรายการ"); return; }
    if(list.some(i=>i.name===nm.trim())){ setErr("มีรายการชื่อนี้อยู่แล้ว"); return; }
    const maxo=Math.max(0,...list.filter(i=>i.zone===zone).map(i=>i.order||0));
    await R("catalog").push({ name:nm.trim(), zone, variant, unit:unit.trim()||"อัน", order:maxo+1 });
    setNm("");
  };
  const del=async(i)=>{
    if(!confirm("ลบ “"+i.name+"” ออกจากฐานข้อมูลชนิดอุปกรณ์?\n\nของที่อยู่ในคลังและประวัติการเบิกจ่ายเดิมจะยังคงอยู่")) return;
    await R("catalog/"+i.id).remove();
  };

  return (<Modal wide title="เพิ่ม/ลบชนิดอุปกรณ์" sub="ฐานข้อมูลกลาง — ใช้ร่วมกันทั้ง 10 หน่วยงาน" onClose={onClose}
    footer={<button className="btn" onClick={onClose}>เสร็จสิ้น</button>}>
    <Msg kind="e">{err}</Msg>
    <div className="grid4" style={{marginBottom:6}}>
      <div className="field" style={{gridColumn:"span 2"}}><label className="lbl">ชื่อรายการ</label>
        <input className="inp" value={nm} onChange={e=>setNm(e.target.value)} placeholder="เช่น ชุดกันฝน"/></div>
      <div className="field"><label className="lbl">โซนการสวมใส่</label>
        <select className="inp" value={zone} onChange={e=>setZone(e.target.value)}>
          {ZONES.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}</select></div>
      <div className="field"><label className="lbl">หน่วยเริ่มต้น</label>
        <ComboBox value={unit} onChange={setUnit} options={UNITS}/></div>
    </div>
    <div className="field"><label className="lbl">ตัวเลือกย่อย</label>
      <select className="inp" value={variant} onChange={e=>setVariant(e.target.value)}>
        {VARIANT_KINDS.map(v=><option key={v.v} value={v.v}>{v.t}</option>)}</select></div>
    <button className="btn block" onClick={add}><Ic n="plus" s={15}/> เพิ่มชนิดอุปกรณ์</button>

    <div className="hr"></div>
    <div className="tblwrap" style={{maxHeight:280,overflowY:"auto"}}>
      <table className="t"><thead><tr><th>ชื่อรายการ</th><th style={{width:120}}>โซน</th>
        <th style={{width:130}}>ตัวเลือกย่อย</th><th style={{width:60}}>หน่วย</th><th style={{width:40}}></th></tr></thead>
        <tbody>{list.map(i=>(<tr key={i.id}>
          <td style={{fontWeight:600}}>{i.name}</td>
          <td style={{fontSize:12.5,color:"var(--ink-2)"}}>{(ZONES.find(z=>z.id===i.zone)||{}).name||"-"}</td>
          <td style={{fontSize:12.5,color:"var(--ink-2)"}}>
            {i.variant==="none"?"—":(i.variant==="color"?"เลือกสี":"ประเภทย่อย + ไซส์")}</td>
          <td style={{fontSize:12.5}}>{i.unit}</td>
          <td><button className="iconbtn danger" onClick={()=>del(i)}><Ic n="trash" s={12}/></button></td>
        </tr>))}</tbody></table>
    </div>
  </Modal>);
}

/* ═══════════════ หน้า 7 — ดูรายการคงคลัง ═══════════════ */
function Page7Stock({office,stock,stockIn}){
  const [q,setQ]=useState("");
  const [busy,setBusy]=useState(false);
  const [issued,setIssued]=useState({});
  const [adj,setAdj]=useState(null);
  const [adjQty,setAdjQty]=useState(0);
  const stageRef=useRef(null);

  useEffect(()=>{
    let live=true;
    R("withdrawals").orderByChild("officeId").equalTo(office.id).once("value").then(s=>{
      if(!live) return;
      const m={}; const v=s.val()||{};
      Object.values(v).forEach(w=>(w.items||[]).forEach(it=>{ m[it.sku]=(m[it.sku]||0)+(it.qty||0); }));
      setIssued(m);
    }).catch(()=>{});
    return ()=>{ live=false; };
  },[office.id,stock]);

  const received = useMemo(()=>{
    const m={}; Object.values(stockIn||{}).forEach(r=>{ m[r.sku]=(m[r.sku]||0)+(r.qty||0); }); return m;
  },[stockIn]);

  const rows = useMemo(()=>{
    const s=q.trim().toLowerCase();
    return Object.entries(stock||{}).map(([sku,v])=>({sku,...v}))
      .filter(r=>!s || fullLabel(r).toLowerCase().indexOf(s)>=0)
      .sort((a,b)=>{
        const za=ZONE_IX[a.zone]??9, zb=ZONE_IX[b.zone]??9; if(za!==zb) return za-zb;
        if(a.itemName!==b.itemName) return a.itemName.localeCompare(b.itemName,"th");
        if((a.subType||"")!==(b.subType||"")) return (a.subType||"").localeCompare(b.subType||"","th");
        const na=parseInt(a.size), nb=parseInt(b.size);
        if(!isNaN(na)&&!isNaN(nb)) return na-nb;
        return String(a.size||"").localeCompare(String(b.size||""),"th");
      });
  },[stock,q]);

  const byZone = useMemo(()=>ZONES.map(z=>({z,rows:rows.filter(r=>r.zone===z.id)})).filter(g=>g.rows.length),[rows]);
  const totalQty = rows.reduce((s,r)=>s+(r.qty||0),0);

  const doExcel=()=>{
    const out=[];
    byZone.forEach(g=>g.rows.forEach((r,i)=>out.push({
      "โซน":g.z.name, "ชื่อรายการ":r.itemName, "ประเภทย่อย":r.subType||"-",
      "ไซส์/สี":r.size||"-", "คงเหลือ":r.qty||0, "หน่วย":r.unit||"",
      "รับเข้าสะสม":received[r.sku]||0, "จ่ายออกสะสม":issued[r.sku]||0
    })));
    exportXLSX(out,"คงคลัง","รายการคงคลัง-"+office.name+"-"+todayISO()+".xlsx",[22,30,22,10,10,8,12,12]);
  };
  const doPDF=async()=>{
    setBusy(true);
    try{ await exportPDF(stageRef.current,"รายการคงคลัง-"+office.name+"-"+todayISO()+".pdf","p"); }
    catch(e){ alert("สร้าง PDF ไม่สำเร็จ: "+e.message); }
    setBusy(false);
  };
  const saveAdj=async()=>{
    const r=adj; const nq=Math.max(0,parseInt(adjQty)||0); const d=nq-(r.qty||0);
    await R("offices/"+office.id+"/stock/"+r.sku).update({qty:nq,updatedAt:nowTs()});
    if(d!==0) await R("offices/"+office.id+"/stockIn").push({
      date:todayISO(), sku:r.sku, itemId:r.itemId, itemName:r.itemName, subType:r.subType||"",
      size:r.size||"", unit:r.unit||"", qty:d, ts:nowTs(), kind:"adjust" });
    setAdj(null);
  };

  return (<Shell title="ดูรายการคงคลัง" sub={office.name}
    right={<button className="btn onplum sm" onClick={()=>go("office/"+office.id+"/items")}><Ic n="back" s={15}/> ย้อนกลับ</button>}
    crumbs={[{t:"หน้าหลัก",to:""},{t:office.name,to:"office/"+office.id},
             {t:"จัดการรายการอุปกรณ์ฯ",to:"office/"+office.id+"/items"},{t:"ดูรายการคงคลัง"}]}>

    <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:14}}>
      <input className="inp" style={{maxWidth:330}} placeholder="ค้นหารายการ…" value={q} onChange={e=>setQ(e.target.value)}/>
      <div className="tb-spacer"></div>
      <button className="btn ghost sm" onClick={doExcel} disabled={!rows.length}><Ic n="file" s={14}/> ส่งออก Excel</button>
      <button className="btn ghost sm" onClick={doPDF} disabled={!rows.length||busy}>
        {busy?<span className="spin"></span>:<Ic n="pdf" s={14}/>} ส่งออก PDF</button>
    </div>

    {rows.length===0
      ? <div className="tblwrap"><Empty icon="box" title="ยังไม่มีของในคลัง"
          desc="ไปที่ “เพิ่มรายการเข้าคลัง” เพื่อบันทึกของที่รับเข้ามา"
          action={<button className="btn" onClick={()=>go("office/"+office.id+"/stock-in")}>
            <Ic n="plus" s={15}/> เพิ่มรายการเข้าคลัง</button>}/></div>
      : <>
        <div className="hint" style={{marginBottom:10}}>
          {rows.length} รายการ · คงเหลือรวม <b className="mono">{totalQty}</b> ชิ้น ·
          เรียงตามลำดับการสวมใส่จากศีรษะลงถึงเท้า</div>
        {byZone.map(g=>(<div className="zone" key={g.z.id}>
          <div className="zone-head">
            <div className="zone-dot"><Ic n={g.z.icon} s={17}/></div>
            <div className="zone-name">{g.z.name}</div>
            <div className="zone-rule"></div>
            <div className="zone-count">{g.rows.length} รายการ</div>
          </div>
          <div className="tblwrap"><table className="t"><thead><tr>
            <th>ชื่อรายการ</th><th style={{width:170}}>ประเภทย่อย</th><th style={{width:90}}>ไซส์/สี</th>
            <th style={{width:92}} className="num">คงเหลือ</th><th style={{width:64}}>หน่วย</th>
            <th style={{width:82}} className="num">รับเข้า</th><th style={{width:82}} className="num">จ่ายออก</th>
            <th style={{width:40}}></th>
          </tr></thead><tbody>
            {g.rows.map(r=>{
              const low=(r.qty||0)<=0?"r":((r.qty||0)<=3?"w":null);
              return (<tr key={r.sku}>
                <td style={{fontWeight:600}}>{r.itemName}</td>
                <td style={{fontSize:13,color:"var(--ink-2)"}}>{r.subType||"—"}</td>
                <td>{r.variant==="color"
                  ? <span style={{display:"inline-flex",alignItems:"center",gap:5}}>
                      <span className="dotc" style={{background:colorHex(r.size)}}></span>{r.size}</span>
                  : <span className="mono">{r.size||"—"}</span>}</td>
                <td className="num"><span className={"chip "+(low||"g")} style={{fontWeight:700}}>{r.qty||0}</span></td>
                <td style={{fontSize:13}}>{r.unit}</td>
                <td className="num mono" style={{color:"var(--ink-3)",fontSize:12.5}}>{received[r.sku]||0}</td>
                <td className="num mono" style={{color:"var(--ink-3)",fontSize:12.5}}>{issued[r.sku]||0}</td>
                <td><button className="iconbtn" title="ปรับปรุงยอดคงเหลือ"
                  onClick={()=>{setAdj(r);setAdjQty(r.qty||0);}}><Ic n="pen" s={12}/></button></td>
              </tr>);
            })}
          </tbody></table></div>
        </div>))}
      </>}

    {adj && <Modal title="ปรับปรุงยอดคงเหลือ" sub={fullLabel(adj)} onClose={()=>setAdj(null)}
      footer={<><button className="btn neutral" onClick={()=>setAdj(null)}>ยกเลิก</button>
              <button className="btn" onClick={saveAdj}>บันทึก</button></>}>
      <div className="field"><label className="lbl">จำนวนคงเหลือที่ถูกต้อง ({adj.unit})</label>
        <input className="inp mono" type="number" min="0" value={adjQty} autoFocus
          onChange={e=>setAdjQty(e.target.value)}/></div>
      <div className="hint">เดิม {adj.qty||0} {adj.unit} — ระบบจะบันทึกส่วนต่างไว้เป็นรายการปรับปรุงในประวัติรับเข้า</div>
    </Modal>}

    {/* เวทีสำหรับสร้าง PDF */}
    <div className="pdfstage" ref={stageRef} aria-hidden="true">
      <div style={{borderBottom:"3px solid #D2A017",paddingBottom:12,marginBottom:16}}>
        <div style={{fontSize:13,color:"#5B2178",fontWeight:700,letterSpacing:".08em"}}>การไฟฟ้าส่วนภูมิภาค</div>
        <div style={{fontSize:24,fontWeight:800}}>รายการอุปกรณ์ความปลอดภัยฯ คงคลัง</div>
        <div style={{fontSize:15,marginTop:2}}>{office.name} · ข้อมูล ณ วันที่ {thDate(todayISO())}</div>
      </div>
      {byZone.map(g=>(<div key={g.z.id} style={{marginBottom:14}}>
        <div style={{fontWeight:800,fontSize:15,background:"#F3ECF8",color:"#3A1147",
          padding:"5px 10px",borderRadius:6,marginBottom:6}}>{g.z.name}</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#FAF8FC"}}>
            {["ลำดับ","ชื่อรายการ","ประเภทย่อย","ไซส์/สี","คงเหลือ","หน่วย","รับเข้า","จ่ายออก"].map((h,i)=>
              <th key={i} style={{border:"1px solid #E5E1EB",padding:"5px 7px",
                textAlign:i>=4?"center":"left",fontWeight:700}}>{h}</th>)}
          </tr></thead>
          <tbody>{g.rows.map((r,i)=>(<tr key={r.sku}>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center"}}>{i+1}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px"}}>{r.itemName}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px"}}>{r.subType||"—"}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center"}}>{r.size||"—"}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center",fontWeight:700}}>{r.qty||0}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center"}}>{r.unit}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center"}}>{received[r.sku]||0}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center"}}>{issued[r.sku]||0}</td>
          </tr>))}</tbody>
        </table>
      </div>))}
      <div style={{marginTop:18,fontSize:12,color:"#8A8296",borderTop:"1px solid #E5E1EB",paddingTop:8}}>
        รวม {rows.length} รายการ · คงเหลือรวม {totalQty} ชิ้น ·
        ออกจากระบบจัดการอุปกรณ์ความปลอดภัยฯ กฟจ.ลำพูน และ กฟส.ในสังกัด
      </div>
    </div>
  </Shell>);
}

/* ═══════════════ หน้า 8 — Dashboard ประวัติการเบิกจ่าย (สาธารณะ) ═══════════════ */
function Page8Dashboard({user}){
  const [raw,setRaw]=useState(null);
  const [f,setF]=useState({office:"",item:"",from:"",to:"",empId:"",name:""});
  const [applied,setApplied]=useState({office:"",item:"",from:"",to:"",empId:"",name:""});
  const [person,setPerson]=useState(null);
  const [busy,setBusy]=useState(false);
  const stageRef=useRef(null);

  useEffect(()=>{
    const ref=R("withdrawals").orderByChild("ts").limitToLast(4000);
    const cb=ref.on("value",s=>{
      const v=s.val()||{};
      setRaw(Object.entries(v).map(([id,w])=>({id,...w})).sort((a,b)=>b.ts-a.ts));
    },()=>setRaw([]));
    return ()=>ref.off("value",cb);
  },[]);

  const itemNames = useMemo(()=>{
    const set=new Set(); (raw||[]).forEach(w=>(w.items||[]).forEach(i=>set.add(i.itemName)));
    return Array.from(set).sort((a,b)=>a.localeCompare(b,"th"));
  },[raw]);

  /* แตกเป็นรายบรรทัด (1 บรรทัด = 1 รายการที่เบิก) */
  const lines = useMemo(()=>{
    const out=[];
    (raw||[]).forEach(w=>(w.items||[]).forEach((it,ix)=>out.push({
      key:w.id+"_"+ix, wid:w.id, ts:w.ts, date:w.date||isoOfTs(w.ts),
      officeId:w.officeId, office:OFC[w.officeId]||w.officeId,
      empId:w.empId||"", name:w.name||"", position:w.position||"", ...it
    })));
    return out;
  },[raw]);

  const filtered = useMemo(()=>{
    const a=applied;
    const nm=a.name.trim().toLowerCase(), eid=a.empId.trim().toLowerCase();
    return lines.filter(l=>{
      if(a.office && l.officeId!==a.office) return false;
      if(a.item   && l.itemName!==a.item)   return false;
      if(a.from   && l.date<a.from)         return false;
      if(a.to     && l.date>a.to)           return false;
      if(eid      && l.empId.toLowerCase().indexOf(eid)<0) return false;
      if(nm       && l.name.toLowerCase().indexOf(nm)<0)   return false;
      return true;
    });
  },[lines,applied]);

  const stats = useMemo(()=>{
    const people=new Set(), offs=new Set(); let qty=0;
    filtered.forEach(l=>{ people.add(l.officeId+"|"+l.empId); offs.add(l.officeId); qty+=(l.qty||0); });
    return { rows:filtered.length, people:people.size, offices:offs.size, qty };
  },[filtered]);

  const personLines = useMemo(()=>{
    if(!person) return [];
    return lines.filter(l=>l.officeId===person.officeId && l.empId===person.empId);
  },[lines,person]);

  const doExcel=()=>{
    exportXLSX(filtered.map((l,i)=>({
      "ลำดับ":i+1,"วันที่":thDate(l.date),"เวลา":thDateTime(l.ts).split(" ")[1],
      "หน่วยงาน":l.office,"รหัสประจำตัว":l.empId,"ชื่อ-นามสกุล":l.name,"ตำแหน่ง":l.position,
      "รายการ":l.itemName,"ประเภทย่อย":l.subType||"-","ไซส์/สี":l.size||"-",
      "จำนวน":l.qty,"หน่วย":l.unit
    })),"ประวัติการเบิกจ่าย","ประวัติการเบิกจ่าย-"+todayISO()+".xlsx",[6,12,7,18,14,26,16,28,20,10,8,8]);
  };
  const doPDF=async()=>{
    setBusy(true);
    try{ await exportPDF(stageRef.current,"ประวัติการเบิกจ่าย-"+todayISO()+".pdf","l"); }
    catch(e){ alert("สร้าง PDF ไม่สำเร็จ: "+e.message); }
    setBusy(false);
  };
  const clear=()=>{ const z={office:"",item:"",from:"",to:"",empId:"",name:""}; setF(z); setApplied(z); };

  if(raw===null) return <Loading t="กำลังโหลดประวัติการเบิกจ่าย…"/>;

  return (<Shell title="Dashboard ประวัติการเบิกจ่าย อุปกรณ์ความปลอดภัยฯ"
    sub="กฟจ.ลำพูน และ กฟส.ในสังกัด · เปิดดูได้โดยไม่ต้องเข้าสู่ระบบ"
    right={<button className="btn onplum sm" onClick={()=>go("")}><Ic n="back" s={15}/> หน้าหลัก</button>}>

    <div className="card card-p" style={{marginTop:6,marginBottom:16}}>
      <div className="grid3">
        <div className="field" style={{margin:0}}><label className="lbl">การไฟฟ้า</label>
          <select className="inp" value={f.office} onChange={e=>setF({...f,office:e.target.value})}>
            <option value="">ทุกหน่วยงาน</option>
            {OFFICES.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}</select></div>
        <div className="field" style={{margin:0}}><label className="lbl">รายการ</label>
          <select className="inp" value={f.item} onChange={e=>setF({...f,item:e.target.value})}>
            <option value="">ทุกรายการ</option>
            {itemNames.map(n=><option key={n} value={n}>{n}</option>)}</select></div>
        <div className="field" style={{margin:0}}><label className="lbl">รหัสพนักงาน</label>
          <input className="inp mono" value={f.empId} placeholder="เช่น 512345"
            onChange={e=>setF({...f,empId:e.target.value})}/></div>
        <div className="field" style={{margin:0}}><label className="lbl">ค้นหารายชื่อ</label>
          <input className="inp" value={f.name} placeholder="พิมพ์ชื่อบางส่วนได้"
            onChange={e=>setF({...f,name:e.target.value})}/></div>
        <div className="field" style={{margin:0}}><label className="lbl">เบิกตั้งแต่วันที่</label>
          <input className="inp mono" type="date" value={f.from} onChange={e=>setF({...f,from:e.target.value})}/></div>
        <div className="field" style={{margin:0}}><label className="lbl">ถึงวันที่</label>
          <input className="inp mono" type="date" value={f.to} onChange={e=>setF({...f,to:e.target.value})}/></div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
        <button className="btn" onClick={()=>{setApplied({...f});setPerson(null);}}><Ic n="search" s={15}/> ค้นหา</button>
        <button className="btn neutral" onClick={clear}>ล้างตัวกรอง</button>
        <div className="tb-spacer"></div>
        <button className="btn ghost sm" onClick={doExcel} disabled={!filtered.length}><Ic n="file" s={14}/> ส่งออก Excel</button>
        <button className="btn ghost sm" onClick={doPDF} disabled={!filtered.length||busy}>
          {busy?<span className="spin"></span>:<Ic n="pdf" s={14}/>} ส่งออก PDF</button>
      </div>
    </div>

    <div className="grid4" style={{marginBottom:16}}>
      {[["รายการที่เบิก",stats.rows],["จำนวนรวม",stats.qty],["ผู้เบิก (คน)",stats.people],["หน่วยงาน",stats.offices]]
        .map(([t,v],i)=>(<div className={"stat"+(i===1?" gold":"")} key={t}>
          <div className="stat-l">{t}</div><div className="stat-v">{v}</div></div>))}
    </div>

    <div className="tblwrap">
      {filtered.length===0
        ? <Empty icon="clock" title="ไม่พบประวัติการเบิกจ่าย" desc="ลองปรับตัวกรองหรือกดล้างตัวกรอง"/>
        : <table className="t"><thead><tr>
            <th style={{width:118}}>วันที่ / เวลา</th><th style={{width:130}}>หน่วยงาน</th>
            <th style={{width:96}}>รหัส</th><th style={{minWidth:170}}>ชื่อ-นามสกุล</th>
            <th>รายการ</th><th style={{width:74}} className="num">จำนวน</th><th style={{width:62}}>หน่วย</th>
          </tr></thead><tbody>
          {filtered.slice(0,600).map(l=>(<tr key={l.key}>
            <td className="mono" style={{fontSize:12}}>{thDateTime(l.ts)}</td>
            <td style={{fontSize:13}}>{l.office}</td>
            <td className="mono" style={{fontSize:12.5}}>{l.empId}</td>
            <td><button className="namebtn"
              onClick={()=>setPerson({officeId:l.officeId,empId:l.empId,name:l.name,position:l.position,office:l.office})}>
              {l.name||"(ไม่ระบุ)"}</button></td>
            <td><div style={{fontWeight:600}}>{l.itemName}</div>
              {(l.subType||l.size) && <div className="hint">{l.subType}
                {l.subType&&l.size?" · ":""}{l.size&&(l.variant==="color"?l.size:"ไซส์ "+l.size)}</div>}</td>
            <td className="num mono" style={{fontWeight:700}}>{l.qty}</td>
            <td style={{fontSize:13}}>{l.unit}</td>
          </tr>))}
        </tbody></table>}
    </div>
    {filtered.length>600 && <div className="hint" style={{marginTop:8}}>
      แสดง 600 แถวแรกจาก {filtered.length} แถว — ใช้ตัวกรองให้แคบลง หรือส่งออกไฟล์เพื่อดูทั้งหมด</div>}
    <div className="hint" style={{marginTop:10}}>
      ชื่อบนหน้าสาธารณะถูกเซ็นเซอร์นามสกุลตามแนวปฏิบัติ PDPA — ดูชื่อเต็มได้ที่หน้า “จัดการรายชื่อ” ของแต่ละหน่วยงาน</div>

    {person && <Modal wide title={person.name} sub={person.office+" · รหัส "+person.empId+(person.position?" · "+person.position:"")}
      onClose={()=>setPerson(null)}
      footer={<><button className="btn neutral" onClick={()=>{
          exportXLSX(personLines.map((l,i)=>({"ลำดับ":i+1,"วันที่":thDate(l.date),"รายการ":l.itemName,
            "ประเภทย่อย":l.subType||"-","ไซส์/สี":l.size||"-","จำนวน":l.qty,"หน่วย":l.unit})),
            "ประวัติรายบุคคล","ประวัติการเบิก-"+person.empId+".xlsx",[6,12,28,20,10,8,8]);
        }}><Ic n="file" s={14}/> ส่งออก Excel</button>
        <button className="btn" onClick={()=>setPerson(null)}>ปิด</button></>}>
      <div className="hint" style={{marginBottom:10}}>เบิกทั้งหมด {personLines.length} รายการ ·
        รวม {personLines.reduce((s,l)=>s+(l.qty||0),0)} ชิ้น</div>
      <div className="tblwrap" style={{maxHeight:400,overflowY:"auto"}}>
        <table className="t"><thead><tr><th style={{width:104}}>วันที่</th><th>รายการ</th>
          <th style={{width:70}} className="num">จำนวน</th><th style={{width:58}}>หน่วย</th></tr></thead>
          <tbody>{personLines.map(l=>(<tr key={l.key}>
            <td className="mono" style={{fontSize:12.5}}>{thDate(l.date)}</td>
            <td><div style={{fontWeight:600}}>{l.itemName}</div>
              {(l.subType||l.size)&&<div className="hint">{l.subType}{l.subType&&l.size?" · ":""}
                {l.size&&(l.variant==="color"?l.size:"ไซส์ "+l.size)}</div>}</td>
            <td className="num mono" style={{fontWeight:700}}>{l.qty}</td>
            <td style={{fontSize:13}}>{l.unit}</td>
          </tr>))}</tbody></table>
      </div>
    </Modal>}

    {/* เวทีสำหรับสร้าง PDF */}
    <div className="pdfstage" ref={stageRef} aria-hidden="true">
      <div style={{borderBottom:"3px solid #D2A017",paddingBottom:12,marginBottom:14}}>
        <div style={{fontSize:13,color:"#5B2178",fontWeight:700,letterSpacing:".08em"}}>การไฟฟ้าส่วนภูมิภาค</div>
        <div style={{fontSize:23,fontWeight:800}}>ประวัติการเบิกจ่ายอุปกรณ์ความปลอดภัยฯ</div>
        <div style={{fontSize:14,marginTop:2}}>
          {applied.office?OFC[applied.office]:"กฟจ.ลำพูน และ กฟส.ในสังกัด"}
          {applied.item?" · รายการ: "+applied.item:""}
          {(applied.from||applied.to)?" · ช่วงวันที่ "+(applied.from?thDate(applied.from):"เริ่มต้น")+" – "+(applied.to?thDate(applied.to):"ปัจจุบัน"):""}
          {" · พิมพ์เมื่อ "+thDate(todayISO())}
        </div>
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead><tr style={{background:"#F3ECF8"}}>
          {["ลำดับ","วันที่","หน่วยงาน","รหัส","ชื่อ-นามสกุล","รายการ","ประเภทย่อย","ไซส์/สี","จำนวน","หน่วย"].map((h,i)=>
            <th key={i} style={{border:"1px solid #E5E1EB",padding:"5px 6px",textAlign:"left",fontWeight:700}}>{h}</th>)}
        </tr></thead>
        <tbody>{filtered.slice(0,900).map((l,i)=>(<tr key={l.key}>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px",textAlign:"center"}}>{i+1}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px",whiteSpace:"nowrap"}}>{thDate(l.date)}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px"}}>{l.office}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px"}}>{l.empId}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px"}}>{l.name}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px"}}>{l.itemName}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px"}}>{l.subType||"—"}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px",textAlign:"center"}}>{l.size||"—"}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px",textAlign:"center",fontWeight:700}}>{l.qty}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px",textAlign:"center"}}>{l.unit}</td>
        </tr>))}</tbody>
      </table>
      <div style={{marginTop:14,fontSize:11.5,color:"#8A8296",borderTop:"1px solid #E5E1EB",paddingTop:8}}>
        รวม {filtered.length} รายการ · จำนวนรวม {stats.qty} ชิ้น · ผู้เบิก {stats.people} คน
      </div>
    </div>
  </Shell>);
}

/* ═══════════════ หน้าสุดท้าย — หน้าเบิกของ (สแกน QR) ═══════════════ */
function Page9Withdraw({office}){
  const [ready,setReady]=useState(false);
  const [people,setPeople]=useState({});
  const [stock,setStock]  =useState({});
  const [who,setWho]      =useState(null);
  const [pickName,setPickName]=useState("");
  const [group,setGroup]  =useState(null);   // {itemName, variants:[...]}
  const [sel,setSel]      =useState(null);   // sku ที่เลือก
  const [qty,setQty]      =useState(1);
  const [cart,setCart]    =useState([]);
  const [err,setErr]      =useState("");
  const [busy,setBusy]    =useState(false);
  const [done,setDone]    =useState(null);

  useEffect(()=>{
    let offs=[];
    const start=async()=>{
      try{ if(!auth.currentUser) await auth.signInAnonymously(); }catch(e){}
      const p=R("offices/"+office.id+"/people"), s=R("offices/"+office.id+"/stock");
      const c1=p.on("value",x=>{ setPeople(x.val()||{}); setReady(true); },()=>setReady(true));
      const c2=s.on("value",x=>setStock(x.val()||{}),()=>{});
      offs=[()=>p.off("value",c1),()=>s.off("value",c2)];
    };
    start();
    return ()=>offs.forEach(f=>f());
  },[office.id]);

  const peopleOpts = useMemo(()=>Object.entries(people).map(([id,p])=>({
    key:id, label:p.fullName, search:(p.empId||"")+" "+(p.fullName||"")+" "+stripPrefix(p.fullName||""),
    empId:p.empId, position:p.position, department:p.department
  })),[people]);

  /* รวมของในคลังเป็นกลุ่มตามชื่อรายการ (เฉพาะที่ยังมีของ) */
  const groups = useMemo(()=>{
    const g={};
    Object.entries(stock).forEach(([sku,v])=>{
      if(!(v.qty>0)) return;
      const inCart=cart.filter(c=>c.sku===sku).reduce((s,c)=>s+c.qty,0);
      const left=(v.qty||0)-inCart;
      if(left<=0) return;
      if(!g[v.itemName]) g[v.itemName]={itemName:v.itemName,zone:v.zone,variant:v.variant,variants:[],total:0};
      g[v.itemName].variants.push({sku,...v,left});
      g[v.itemName].total+=left;
    });
    return Object.values(g).sort((a,b)=>((ZONE_IX[a.zone]??9)-(ZONE_IX[b.zone]??9))||a.itemName.localeCompare(b.itemName,"th"));
  },[stock,cart]);

  const itemOpts = groups.map(g=>({ key:g.itemName, label:g.itemName, search:g.itemName,
    hint:(ZONES.find(z=>z.id===g.zone)||{}).name+" · คงเหลือ "+g.total }));

  const cur = group ? groups.find(g=>g.itemName===group.itemName) : null;
  const selRow = cur && sel ? cur.variants.find(v=>v.sku===sel) : null;

  const addCart=()=>{
    setErr("");
    if(!cur){ setErr("เลือกรายการที่จะเบิกก่อน"); return; }
    if(cur.variants.length>1 && !selRow){ setErr("เลือก"+(cur.variant==="color"?"สี":"ประเภทย่อย/ไซส์")+"ก่อน"); return; }
    const row = selRow || cur.variants[0];
    if(qty>row.left){ setErr("คงเหลือ "+row.left+" "+row.unit+" — เบิกได้ไม่เกินนี้"); return; }
    setCart(c=>{
      const ix=c.findIndex(x=>x.sku===row.sku);
      if(ix>=0){ const n=[...c]; n[ix]={...n[ix],qty:n[ix].qty+qty}; return n; }
      return [...c,{ sku:row.sku, itemId:row.itemId, itemName:row.itemName, variant:row.variant,
                     subType:row.subType||"", size:row.size||"", unit:row.unit, qty }];
    });
    setGroup(null); setSel(null); setQty(1); setPickName("");
  };

  const confirm=async()=>{
    if(!who||!cart.length) return;
    setBusy(true); setErr("");
    try{
      /* ตัดสต๊อกแบบ transaction กันชนกันเมื่อมีหลายคนเบิกพร้อมกัน */
      for(const it of cart){
        const res=await R("offices/"+office.id+"/stock/"+it.sku+"/qty").transaction(cq=>{
          if(cq===null) return cq;
          if(cq < it.qty) return;               // ยกเลิก — ของไม่พอ
          return cq - it.qty;
        });
        if(!res.committed) throw new Error("ของไม่พอสำหรับ "+fullLabel(it)+" — กรุณาลองใหม่");
      }
      const rec={ officeId:office.id, empId:who.empId||"", name:censorName(who.fullName),
                  position:who.position||"", items:cart, qty:cart.reduce((s,i)=>s+i.qty,0),
                  date:todayISO(), ts:nowTs() };
      await R("withdrawals").push(rec);
      setDone(rec); setCart([]);
    }catch(e){ setErr(e.message||"บันทึกไม่สำเร็จ"); }
    setBusy(false);
  };

  if(!ready) return <Loading t="กำลังเชื่อมต่อคลัง…"/>;

  if(done) return (<Shell title="เบิกอุปกรณ์สำเร็จ" sub={office.name}>
    <div className="card card-p" style={{maxWidth:560,margin:"26px auto",textAlign:"center",
      borderColor:"var(--ok-line)",background:"var(--ok-soft)"}}>
      <div style={{width:52,height:52,borderRadius:99,background:"var(--ok)",color:"#fff",
        display:"grid",placeItems:"center",margin:"0 auto 12px"}}><Ic n="check" s={28}/></div>
      <h2 style={{fontSize:19}}>บันทึกการเบิกเรียบร้อย</h2>
      <div className="hint" style={{marginTop:4}}>{done.name} · {thDateTime(done.ts)}</div>
      <div style={{background:"#fff",borderRadius:10,padding:14,marginTop:14,textAlign:"left"}}>
        {done.items.map((it,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",
          gap:10,padding:"6px 0",borderBottom:i<done.items.length-1?"1px solid #F2EFF6":"none"}}>
          <span style={{fontWeight:600}}>{fullLabel(it)}</span>
          <span className="mono" style={{fontWeight:700,whiteSpace:"nowrap"}}>{it.qty} {it.unit}</span>
        </div>))}
      </div>
      <button className="btn" style={{marginTop:16}} onClick={()=>{setDone(null);setWho(null);setPickName("");}}>
        เบิกรายการใหม่</button>
    </div>
  </Shell>);

  return (<Shell title="เบิกอุปกรณ์ความปลอดภัยฯ" sub={office.name}>
    <div style={{maxWidth:640,margin:"0 auto"}}>
      {err && <Msg kind="e">{err}</Msg>}

      {/* ขั้นที่ 1 — ระบุตัวผู้เบิก */}
      <div className="card card-p stepcard on" style={{marginTop:16}}>
        <div className="sec-head" style={{margin:"0 0 12px"}}>
          <span className="eyebrow">ขั้นที่ 1</span><h2 style={{fontSize:16}}>ผู้เบิก</h2></div>
        {who
          ? <div style={{display:"flex",alignItems:"center",gap:12,background:"var(--plum-100)",
              border:"1px solid var(--plum-200)",borderRadius:10,padding:"11px 14px"}}>
              <Ic n="users" s={20} c="var(--plum-700)"/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700}}>{who.fullName}</div>
                <div className="hint">รหัส {who.empId||"—"}{who.position?" · "+who.position:""}
                  {who.department?" · "+who.department:""}</div>
              </div>
              <button className="btn neutral xs" onClick={()=>{setWho(null);setPickName("");setCart([]);}}>เปลี่ยน</button>
            </div>
          : <>
            <label className="lbl">พิมพ์รหัสประจำตัว หรือชื่อของท่าน</label>
            <Typeahead options={peopleOpts} value={pickName} autoFocus
              placeholder="เช่น 512345 หรือ เกียรติพงษ์"
              emptyText="ไม่พบรหัส/ชื่อนี้ — ติดต่อผู้ดูแลคลังของหน่วยงาน"
              onPick={o=>{ const p=people[o.key]; setWho({id:o.key,...p}); setPickName(o.label); setErr(""); }}
              render={o=>(<div style={{display:"flex",gap:10,alignItems:"baseline"}}>
                <span className="mono" style={{fontSize:12,color:"var(--plum-700)",minWidth:62}}>{o.empId||"—"}</span>
                <span><div style={{fontWeight:600}}>{o.label}</div>
                  {o.position && <small>{o.position}{o.department?" · "+o.department:""}</small>}</span>
              </div>)}/>
          </>}
      </div>

      {/* ขั้นที่ 2 — เลือกของ */}
      {who && <div className="card card-p stepcard on" style={{marginTop:16}}>
        <div className="sec-head" style={{margin:"0 0 12px"}}>
          <span className="eyebrow">ขั้นที่ 2</span><h2 style={{fontSize:16}}>เลือกอุปกรณ์ที่จะเบิก</h2></div>

        {groups.length===0
          ? <Empty icon="box" title="ไม่มีของคงเหลือในคลัง" desc="ติดต่อผู้ดูแลคลังของหน่วยงาน"/>
          : <>
            <label className="lbl">ค้นหารายการ</label>
            <Typeahead options={itemOpts} value={group?group.itemName:""}
              placeholder="พิมพ์ค้นหา เช่น ถุงมือ หมวก รองเท้า…"
              emptyText="ไม่พบรายการที่มีของคงเหลือ"
              onPick={o=>{ const g=groups.find(x=>x.itemName===o.key);
                setGroup(g); setSel(g.variants.length===1?g.variants[0].sku:null); setQty(1); setErr(""); }}
              render={o=>(<div><div style={{fontWeight:600}}>{o.label}</div><small>{o.hint}</small></div>)}/>

            {cur && cur.variants.length>1 && <div style={{marginTop:14}}>
              <label className="lbl">เลือก{cur.variant==="color"?"สี":"ประเภทย่อย / ไซส์"} <span className="req">*</span></label>
              <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
                {[...cur.variants].sort((a,b)=>{
                    if((a.subType||"")!==(b.subType||"")) return (a.subType||"").localeCompare(b.subType||"","th");
                    const na=parseInt(a.size),nb=parseInt(b.size);
                    return (!isNaN(na)&&!isNaN(nb))?na-nb:String(a.size||"").localeCompare(String(b.size||""),"th");
                  }).map(v=>(
                  <button key={v.sku} className={"chip clk"+(sel===v.sku?"":" n")}
                    onClick={()=>{ setSel(v.sku); setQty(1); setErr(""); }}
                    style={sel===v.sku?{borderColor:"var(--plum-700)",background:"var(--plum-100)",boxShadow:"0 0 0 2px var(--plum-100)"}:null}>
                    {v.variant==="color" && <span className="dotc" style={{background:colorHex(v.size)}}></span>}
                    {v.subType?v.subType+" ":""}
                    {v.size && (v.variant==="color"?(v.subType?"· "+v.size:""):"ไซส์ "+v.size)}
                    <span className="mono" style={{opacity:.65,fontSize:11}}>· เหลือ {v.left}</span>
                  </button>))}
              </div>
            </div>}

            {cur && <div style={{marginTop:14,display:"grid",gridTemplateColumns:"1fr auto",gap:12,alignItems:"end"}}>
              <div><label className="lbl">จำนวนที่เบิก
                {selRow && <span className="hint" style={{fontWeight:400}}> (คงเหลือ {selRow.left} {selRow.unit})</span>}</label>
                <QtyPicker value={qty} onChange={setQty} max={selRow?selRow.left:9999}/></div>
              <button className="btn" onClick={addCart}><Ic n="plus" s={16}/> เพิ่มลงรายการ</button>
            </div>}
          </>}
      </div>}

      {/* ขั้นที่ 3 — ยืนยัน */}
      {who && cart.length>0 && <div className="card card-p stepcard on" style={{marginTop:16,borderColor:"var(--plum-200)"}}>
        <div className="sec-head" style={{margin:"0 0 10px"}}>
          <span className="eyebrow">ขั้นที่ 3</span><h2 style={{fontSize:16}}>ตรวจสอบและยืนยัน</h2>
          <div className="tb-spacer"></div><span className="chip">{cart.length} รายการ</span></div>
        {cart.map((it,i)=>(<div key={it.sku} style={{display:"flex",alignItems:"center",gap:10,
          padding:"9px 0",borderBottom:i<cart.length-1?"1px solid #F2EFF6":"none"}}>
          <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600}}>{it.itemName}</div>
            {(it.subType||it.size) && <div className="hint">{it.subType}{it.subType&&it.size?" · ":""}
              {it.size&&(it.variant==="color"?it.size:"ไซส์ "+it.size)}</div>}</div>
          <span className="mono" style={{fontWeight:700}}>{it.qty} {it.unit}</span>
          <button className="iconbtn danger" onClick={()=>setCart(c=>c.filter((_,ix)=>ix!==i))}>
            <Ic n="trash" s={13}/></button>
        </div>))}
        <button className="btn ok block" style={{marginTop:14,padding:"12px 16px",fontSize:15.5}}
          onClick={confirm} disabled={busy}>
          {busy?<span className="spin" style={{borderColor:"rgba(255,255,255,.4)",borderTopColor:"#fff"}}></span>
               :<Ic n="check" s={18}/>} ยืนยันการเบิก</button>
      </div>}

      <div className="hint" style={{textAlign:"center",margin:"22px 0 0"}}>
        ระบบจัดการอุปกรณ์ความปลอดภัยฯ · กฟจ.ลำพูน และ กฟส.ในสังกัด</div>
    </div>
  </Shell>);
}

/* ═══════════════ ROUTER + APP ═══════════════ */
function useHash(){
  const [seg,setSeg]=useState(parseHash());
  useEffect(()=>{
    const h=()=>{ setSeg(parseHash()); window.scrollTo(0,0); };
    window.addEventListener("hashchange",h);
    return ()=>window.removeEventListener("hashchange",h);
  },[]);
  return seg;
}

/* โหลดข้อมูลของหน่วยงานที่กำลังเปิดอยู่ */
function useOfficeData(oid,enabled){
  const [d,setD]=useState({people:{},stock:{},stockIn:{},freq:{},loaded:false});
  useEffect(()=>{
    if(!oid||!enabled){ setD({people:{},stock:{},stockIn:{},freq:{},loaded:false}); return; }
    const base="offices/"+oid+"/";
    const refs={ people:R(base+"people"), stock:R(base+"stock"),
                 stockIn:R(base+"stockIn"), freq:R(base+"freq") };
    const cbs={};
    Object.entries(refs).forEach(([k,ref])=>{
      cbs[k]=ref.on("value",s=>setD(p=>({...p,[k]:s.val()||{},loaded:true})),
                    ()=>setD(p=>({...p,loaded:true})));
    });
    return ()=>Object.entries(refs).forEach(([k,ref])=>ref.off("value",cbs[k]));
  },[oid,enabled]);
  return d;
}

function Denied({title,desc,onBack}){
  return (<Shell title="ไม่มีสิทธิ์เข้าถึง">
    <div className="card card-p" style={{maxWidth:520,margin:"32px auto",textAlign:"center"}}>
      <Ic n="lock" s={32} c="var(--plum-200)"/>
      <h2 style={{fontSize:18,margin:"10px 0 6px"}}>{title}</h2>
      <p className="hint" style={{margin:"0 0 16px"}}>{desc}</p>
      <button className="btn" onClick={onBack||(()=>go(""))}>กลับหน้าเข้าสู่ระบบ</button>
    </div>
  </Shell>);
}

function App(){
  const seg=useHash();
  const [user,setUser]=useState(null);
  const [authReady,setAuthReady]=useState(false);
  const [accounts,setAccounts]=useState(null);
  const [catalog,setCatalog]=useState(null);
  const seeded=useRef(false);

  useEffect(()=>auth.onAuthStateChanged(u=>{ setUser(u); setAuthReady(true); }),[]);

  useEffect(()=>{
    const a=R("accounts"), c=R("catalog");
    const ca=a.on("value",s=>setAccounts(s.val()||{}),()=>setAccounts({}));
    const cc=c.on("value",s=>setCatalog(s.val()||{}),()=>setCatalog({}));
    return ()=>{ a.off("value",ca); c.off("value",cc); };
  },[]);

  const realUser = user && !user.isAnonymous ? user : null;
  const isMaster = !!realUser && String(realUser.email||"").toLowerCase()===MASTER_EMAIL;
  const myOffice = useMemo(()=>{
    if(!realUser||isMaster||!accounts) return null;
    const hit=Object.entries(accounts).find(([oid,a])=>a && a.uid===realUser.uid);
    return hit?hit[0]:null;
  },[realUser,isMaster,accounts]);

  /* ติดตั้งรายการอุปกรณ์ตั้งต้นครั้งแรก (แอดมินหลักเท่านั้น) */
  useEffect(()=>{
    if(!isMaster||!catalog||seeded.current) return;
    if(Object.keys(catalog).length>0){ seeded.current=true; return; }
    seeded.current=true;
    const up={}; SEED_ITEMS.forEach((it,i)=>{ up[R("catalog").push().key]={...it,order:i}; });
    R("catalog").update(up).catch(()=>{});
  },[isMaster,catalog]);

  /* พาแอดมินประจำหน่วยงานเข้าหน้าของตัวเองอัตโนมัติ */
  useEffect(()=>{
    if(myOffice && seg.length===0) go("office/"+myOffice);
  },[myOffice,seg.length]);

  const officeId = seg[0]==="office" ? seg[1] : (seg[0]==="w" ? seg[1] : null);
  const od = useOfficeData(seg[0]==="office"?officeId:null, !!realUser && (isMaster||myOffice===officeId));

  const logout=async()=>{ await auth.signOut(); go(""); };

  /* ── หน้าสาธารณะ ── */
  if(seg[0]==="w"){
    const office=OFFICES.find(o=>o.id===seg[1]);
    if(!office) return <Denied title="ไม่พบหน่วยงาน" desc="ลิงก์หรือ QR Code ไม่ถูกต้อง"/>;
    return <Page9Withdraw office={office}/>;
  }
  if(seg[0]==="dashboard") return <Page8Dashboard user={realUser}/>;

  if(!authReady||accounts===null||catalog===null) return <Loading/>;

  if(seg[0]==="accounts")
    return <Page2Accounts accounts={accounts} isMaster={isMaster} user={realUser||{}}/>;

  if(seg[0]==="office"){
    const office=OFFICES.find(o=>o.id===seg[1]);
    if(!office) return <Denied title="ไม่พบหน่วยงาน" desc="ตรวจสอบลิงก์อีกครั้ง"/>;
    if(!realUser) return <Page1Login accounts={accounts}/>;
    if(!isMaster && myOffice!==office.id)
      return <Denied title="เข้าหน่วยงานนี้ไม่ได้"
        desc={"บัญชีของท่านมีสิทธิ์เฉพาะ "+(myOffice?OFC[myOffice]:"หน่วยงานที่ผูกไว้")+" เท่านั้น"}
        onBack={()=>go(myOffice?"office/"+myOffice:"")}/>;

    const page=seg[2];
    if(page==="roster")   return <Page4Roster office={office} people={od.people}/>;
    if(page==="items")    return <Page5Items office={office} stock={od.stock}/>;
    if(page==="stock-in") return <Page6StockIn office={office} catalog={catalog} freq={od.freq} user={realUser}/>;
    if(page==="stock")    return <Page7Stock office={office} stock={od.stock} stockIn={od.stockIn}/>;
    return <Page3Office office={office} user={realUser} isMaster={isMaster}
             onLogout={logout} stock={od.stock} people={od.people}/>;
  }

  /* หน้า 1 — แอดมินหลักที่ล็อกอินแล้ว เลือกหน่วยงานได้ทันที */
  if(isMaster) return <MasterHome user={realUser} accounts={accounts} onLogout={logout}/>;
  return <Page1Login accounts={accounts}/>;
}

/* หน้าหลักของแอดมินหลักหลังล็อกอิน */
function MasterHome({user,accounts,onLogout}){
  return (<Shell title="ระบบจัดการอุปกรณ์ความปลอดภัยฯ"
    sub="กฟจ.ลำพูน และ กฟส.ในสังกัด · เข้าใช้งานในฐานะแอดมินหลัก"
    right={<div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
      <span className="tb-mail">{user.email}</span>
      <button className="btn onplum sm" onClick={()=>go("accounts")}><Ic n="wrench" s={14}/> จัดการบัญชีผู้ใช้</button>
      <button className="btn onplum sm" onClick={onLogout}><Ic n="out" s={14}/> ออกจากระบบ</button>
    </div>}>
    <div className="sec-head" style={{marginTop:14}}><h2>เลือกหน่วยงานที่ต้องการจัดการ</h2></div>
    <div className="oflist">
      {OFFICES.map((o,i)=>(<button key={o.id} className="ofrow" onClick={()=>go("office/"+o.id)}>
        <span className="ofrow-n">{i+1}</span>
        <span className="ofrow-name">{o.name}</span>
        <span className={"ofrow-st"+(accounts[o.id]?" on":"")}>
          <i></i><span>{accounts[o.id]?"มีแอดมินประจำหน่วยงาน":"ยังไม่ได้ตั้งบัญชี"}</span></span>
        <Ic n="chev" s={14} c="var(--ink-3)"/>
      </button>))}
    </div>
    <div style={{marginTop:22,display:"flex",gap:9,flexWrap:"wrap"}}>
      <button className="btn ghost" onClick={()=>go("dashboard")}>
        <Ic n="chart" s={15}/> Dashboard ประวัติการเบิกจ่าย (ลิงก์สาธารณะ)</button>
      <button className="btn neutral" onClick={()=>{
        navigator.clipboard.writeText(location.origin+location.pathname+"#/dashboard");
        alert("คัดลอกลิงก์ Dashboard สาธารณะแล้ว");
      }}><Ic n="link" s={15}/> คัดลอกลิงก์ Dashboard</button>
    </div>
  </Shell>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
