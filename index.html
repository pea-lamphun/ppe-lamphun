<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>ระบบจัดการอุปกรณ์ความปลอดภัยฯ กฟจ.ลำพูน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js" crossorigin></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ═══ Design tokens — โทนขาวสะอาดแบบ Google Workspace ═══ */
:root{
  --fb:'Noto Sans Thai','Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fd:'Noto Sans Thai','Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fm:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --plum-900:#4A0072; --plum-700:#6A1B9A; --plum-600:#7B1FA2; --plum-500:#9333B5;
  --plum-200:#E4CFF0; --plum-100:#F6EFFA; --plum-050:#FBF8FD;
  --gold-600:#B06000; --gold-400:#F9AB00; --gold-100:#FEF7E0;

  --ink:#202124; --ink-2:#5F6368; --ink-3:#80868B; --ink-4:#9AA0A6;
  --line:#DADCE0; --line-2:#E8EAED;
  --paper:#F8F9FA; --card:#FFFFFF;

  --ok:#188038;   --ok-soft:#E6F4EA;   --ok-line:#CEEAD6;
  --warn:#B06000; --warn-soft:#FEF7E0; --warn-line:#FDE293;
  --bad:#C5221F;  --bad-soft:#FCE8E6;  --bad-line:#F6AEA9;

  --r:8px; --r-s:6px; --r-xs:4px;
  --sh:0 1px 2px rgba(60,64,67,.08);
  --sh-2:0 1px 3px rgba(60,64,67,.12),0 4px 12px rgba(60,64,67,.10);
  --sh-3:0 12px 32px rgba(60,64,67,.20);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:14.5px;
  line-height:1.62;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
a{color:var(--plum-700);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:500;letter-spacing:-.005em;line-height:1.35;font-family:var(--fd)}
::selection{background:var(--plum-100);color:var(--plum-900)}
:focus-visible{outline:2px solid var(--plum-600);outline-offset:2px;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ═══ Shell ═══ */
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 72px}
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.topbar .wrap{padding:12px 24px}
.tb-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#8E31B0 0%,var(--plum-700) 55%,#57157A 100%);
  box-shadow:0 2px 6px rgba(106,27,154,.32),inset 0 1px 0 rgba(255,255,255,.22)}
.tb-title{font-size:17.5px;font-weight:500;letter-spacing:-.008em;line-height:1.3;color:var(--ink)}
.tb-sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.tb-mail{font-size:12px;color:var(--ink-3);font-family:var(--fm)}
.tb-spacer{flex:1}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);padding:18px 0 2px;flex-wrap:wrap}
.crumb a{color:var(--ink-2);font-weight:500}
.crumb a:hover{color:var(--plum-700);text-decoration:underline}

/* ═══ Surfaces ═══ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card-p{padding:20px}
.sec-head{display:flex;align-items:center;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sec-head h2{font-size:16px;font-weight:500;color:var(--ink)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--plum-700);background:var(--plum-100);padding:3px 9px;border-radius:99px;line-height:1.5}
.hr{height:1px;background:var(--line-2);margin:18px 0;border:none}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.55}

/* ═══ Buttons ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8.5px 18px;
  border-radius:var(--r-s);border:1px solid transparent;font-weight:500;font-size:14px;
  background:var(--plum-700);color:#fff;font-family:var(--fb);
  transition:background .15s var(--ease),box-shadow .15s var(--ease),border-color .15s}
.btn:hover{background:var(--plum-600);box-shadow:var(--sh)}
.btn:active{background:var(--plum-900)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--plum-700);border-color:var(--line)}
.btn.ghost:hover{background:var(--plum-050);border-color:var(--plum-200);box-shadow:none}
.btn.neutral,.btn.onplum{background:#fff;color:var(--ink-2);border-color:var(--line)}
.btn.neutral:hover,.btn.onplum:hover{background:var(--paper);color:var(--ink);box-shadow:none}
.btn.ok{background:var(--ok)} .btn.ok:hover{background:#12692D}
.btn.bad{background:#fff;color:var(--bad);border-color:var(--line)}
.btn.bad:hover{background:var(--bad-soft);border-color:var(--bad-line);box-shadow:none}
.btn.gold{background:#fff;color:#3C4043;border-color:var(--line);font-weight:500}
.btn.gold:hover{background:var(--paper);box-shadow:var(--sh)}
.btn.sm{padding:6.5px 13px;font-size:13px;gap:6px}
.btn.xs{padding:4.5px 10px;font-size:12.5px;border-radius:var(--r-xs);gap:5px}
.btn.lg{padding:11px 22px;font-size:15px}
.btn.block{width:100%}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:var(--r-s);padding:5.5px;
  display:inline-flex;color:var(--ink-3);transition:all .13s var(--ease)}
.iconbtn:hover{background:var(--plum-100);color:var(--plum-700);border-color:var(--plum-200)}
.iconbtn.danger:hover{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}

/* ═══ Forms ═══ */
.field{margin-bottom:16px}
.lbl{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.lbl .req{color:var(--bad);margin-left:2px}
.inp{width:100%;padding:9.5px 13px;border:1px solid var(--line);border-radius:var(--r-s);
  background:#fff;outline:none;color:var(--ink);transition:border-color .13s,box-shadow .13s}
.inp::placeholder{color:var(--ink-4)}
.inp:hover{border-color:var(--ink-4)}
.inp:focus{border-color:var(--plum-600);box-shadow:0 0 0 2px var(--plum-100)}
select.inp{appearance:none;cursor:pointer;padding-right:34px;background-repeat:no-repeat;background-position:right 11px center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='11' viewBox='0 0 24 24' fill='none' stroke='%235F6368' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>")}
input[type=date].inp{cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.grid3,.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.checkbox{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-2);
  background:#fff;border:1px solid var(--line);border-radius:var(--r-s);padding:7.5px 12px;cursor:pointer}
.checkbox:hover{background:var(--paper);color:var(--ink)}
.checkbox input{accent-color:var(--plum-700);width:15px;height:15px;cursor:pointer}

/* ═══ Typeahead ═══ */
.ta{position:relative}
.ta-list{position:absolute;z-index:60;left:0;right:0;top:calc(100% + 4px);background:#fff;
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-3);max-height:300px;overflow-y:auto;padding:6px}
.ta-item{padding:8px 11px;cursor:pointer;font-size:14px;border-radius:var(--r-s);display:flex;gap:11px;align-items:center}
.ta-item:hover,.ta-item.on{background:var(--plum-100)}
.ta-item small{display:block;color:var(--ink-3);font-size:11.5px;line-height:1.45}
.ta-empty{padding:20px 12px;color:var(--ink-3);font-size:13px;text-align:center}

/* ═══ Tables ═══ */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:#fff;color:var(--ink-3);font-weight:500;font-size:12px;letter-spacing:.02em;
  padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr{transition:background .1s}
table.t tbody tr:hover{background:var(--paper)}
.num{text-align:right}
.ctr{text-align:center}
.namebtn{font-weight:500;color:var(--plum-700);text-align:left}
.namebtn:hover{text-decoration:underline}

/* ═══ Zone rail ═══ */
.zone{margin-bottom:22px}
.zone-head{display:flex;align-items:center;gap:11px;padding:0 2px 9px}
.zone-dot{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--plum-100);color:var(--plum-700)}
.zone-name{font-weight:500;font-size:14px}
.zone-rule{flex:1;height:1px;background:var(--line-2)}
.zone-count{font-size:12px;color:var(--ink-3);font-family:var(--fm)}

/* ═══ Chips ═══ */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;
  font-weight:500;background:var(--plum-100);color:var(--plum-700);border:1px solid transparent;line-height:1.6}
.chip.g{background:var(--ok-soft);color:var(--ok)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.r{background:var(--bad-soft);color:var(--bad)}
.chip.n{background:var(--paper);color:var(--ink-2);border-color:var(--line)}
.chip.clk{cursor:pointer;border-color:var(--line);background:#fff;transition:all .13s var(--ease)}
.chip.clk:hover{background:var(--plum-050);border-color:var(--plum-200)}
.dotc{width:11px;height:11px;border-radius:99px;border:1px solid rgba(0,0,0,.2);display:inline-block;flex:none}

/* ═══ หน้า 1 ═══ */
/* ═══ Hero (หน้าแรก) ═══ */
.hero{position:relative;overflow:hidden;border-radius:18px;color:#fff;margin-top:26px;
  padding:32px 36px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;
  background:linear-gradient(125deg,#8E31B0 0%,#6A1B9A 52%,#48136A 100%);
  box-shadow:0 14px 36px rgba(106,27,154,.26)}
.hero::after{content:"";position:absolute;right:-80px;top:-110px;width:320px;height:320px;
  border-radius:50%;background:rgba(255,255,255,.085)}
.hero::before{content:"";position:absolute;right:120px;bottom:-140px;width:230px;height:230px;
  border-radius:50%;background:rgba(255,255,255,.06)}
.hero-b{position:relative;z-index:1;flex:1;min-width:250px}
.hero-k{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.7)}
.hero-t{font-size:25px;font-weight:600;letter-spacing:-.018em;line-height:1.3;margin-top:7px}
.hero-d{font-size:14px;color:rgba(255,255,255,.78);margin-top:7px}
.hero-a{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;min-width:246px}
.btn.onhero{background:#fff;color:var(--plum-700);font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.14)}
.btn.onhero:hover{background:#F7F0FB;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.btn.onhero2{background:rgba(255,255,255,.13);color:#fff;border-color:rgba(255,255,255,.34)}
.btn.onhero2:hover{background:rgba(255,255,255,.24);box-shadow:none}
@media(max-width:640px){.hero{padding:24px 22px;border-radius:14px}.hero-t{font-size:21px}.hero-a{width:100%;min-width:0}}

/* ═══ การ์ดหน่วยงาน ═══ */
.ofgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.ofcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;
  text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease),transform .16s var(--ease)}
.ofcard::after{content:"";position:absolute;right:-50px;top:-50px;width:125px;height:125px;
  border-radius:50%;background:var(--plum-100);opacity:0;
  transition:opacity .22s,transform .36s var(--ease)}
.ofcard:hover:not(:disabled){border-color:var(--plum-600);transform:translateY(-3px);
  box-shadow:0 10px 26px rgba(123,31,162,.18)}
.ofcard:hover:not(:disabled)::after{opacity:.7;transform:scale(1.3)}
.ofcard:disabled{cursor:not-allowed;background:#FCFBFD}
.ofcard:disabled .ofnm{color:var(--ink-4)}
.ofn{position:relative;z-index:1;width:38px;height:38px;border-radius:11px;flex:none;display:grid;
  place-items:center;font-family:var(--fm);font-size:13.5px;background:var(--paper);
  color:var(--ink-2);border:1px solid var(--line);transition:all .18s var(--ease)}
.ofcard:hover:not(:disabled) .ofn{background:var(--plum-700);color:#fff;border-color:var(--plum-700);
  box-shadow:0 3px 10px rgba(123,31,162,.32)}
.ofb{position:relative;z-index:1;flex:1;min-width:0}
.ofnm{font-weight:600;font-size:15.5px;letter-spacing:-.008em;line-height:1.3}
.ofst{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-4);margin-top:3px}
.ofst i{width:7px;height:7px;border-radius:99px;background:var(--ink-4);display:block;flex:none}
.ofst.on{color:var(--ok)}
.ofst.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(24,128,56,.15)}
.ofgo{position:relative;z-index:1;color:var(--ink-4);display:flex;flex:none;transition:all .18s var(--ease)}
.ofcard:hover:not(:disabled) .ofgo{color:var(--plum-700);transform:translateX(3px)}

/* ═══ หน้าเบิกของ (สแกน QR) ═══ */
.wbar{color:#fff;padding:18px 0 20px;position:relative;overflow:hidden;
  background:linear-gradient(125deg,#8E31B0 0%,#6A1B9A 55%,#48136A 100%)}
.wbar::after{content:"";position:absolute;right:-60px;top:-90px;width:240px;height:240px;
  border-radius:50%;background:rgba(255,255,255,.08)}
.wbar .wrap{padding:0 20px;position:relative;z-index:1}
.wrow{display:flex;align-items:center;gap:13px}
.wmk{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.24)}
.wt{font-size:18.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.ws{font-size:12.5px;color:rgba(255,255,255,.78);margin-top:1px}
.steps{display:flex;align-items:center;margin-top:20px}
.stp{display:flex;align-items:center;gap:9px}
.stp-n{width:29px;height:29px;border-radius:99px;display:grid;place-items:center;flex:none;
  font-size:12.5px;font-weight:600;font-family:var(--fm);border:1.5px solid transparent;
  background:rgba(255,255,255,.16);color:rgba(255,255,255,.75);transition:all .22s var(--ease)}
.stp.on .stp-n{background:#fff;color:var(--plum-700);box-shadow:0 0 0 4px rgba(255,255,255,.22)}
.stp.done .stp-n{background:#3DD07F;color:#0A4526}
.stp-l{font-size:12.5px;color:rgba(255,255,255,.7);white-space:nowrap}
.stp.on .stp-l{color:#fff;font-weight:600}
.stp-line{flex:1;height:2px;border-radius:2px;margin:0 11px;background:rgba(255,255,255,.2)}
.stp-line.done{background:#3DD07F}
@media(max-width:640px){.stp-l{display:none}.stp-line{margin:0 7px}.wt{font-size:16.5px}}
.wwrap{max-width:660px;margin:0 auto;padding:0 18px 80px}
.camov{position:fixed;inset:0;z-index:400;background:#000;display:flex;flex-direction:column}
.camvid{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
.cambar{flex:none;padding:16px 22px calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:space-between;gap:18px;background:#0B0B0E}
.camrnd{width:46px;height:46px;border-radius:99px;flex:none;display:grid;place-items:center;
  color:#fff;background:rgba(255,255,255,.14);transition:background .15s}
.camrnd:active{background:rgba(255,255,255,.28)}
.shutter{width:72px;height:72px;border-radius:99px;flex:none;background:#fff;
  box-shadow:0 0 0 5px rgba(255,255,255,.3);transition:transform .1s}
.shutter:active{transform:scale(.93)}
.shutter:disabled{opacity:.4}
.camtip{position:absolute;left:0;right:0;top:0;padding:14px 20px calc(14px + env(safe-area-inset-top,0px));
  color:#fff;font-size:13.5px;background:linear-gradient(#000A,transparent);text-align:center}
.camerr{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);
  background:#fff;border-radius:14px;padding:20px;text-align:center}
.loadover{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;
  background:rgba(42,11,61,.55);backdrop-filter:blur(4px);animation:fade .15s var(--ease)}
.loadbox{background:#fff;border-radius:18px;padding:30px 34px 26px;text-align:center;
  box-shadow:var(--sh-3);min-width:270px;max-width:340px;animation:pop .2s var(--ease)}
.bigspin{width:54px;height:54px;margin:0 auto 16px;position:relative}
.bigspin::before,.bigspin::after{content:"";position:absolute;inset:0;border-radius:99px;border:4px solid transparent}
.bigspin::before{border-color:var(--plum-100)}
.bigspin::after{border-top-color:var(--plum-700);border-right-color:var(--plum-700);
  animation:sp .85s cubic-bezier(.5,.15,.5,.85) infinite}
.loadt{font-weight:600;font-size:15.5px;color:var(--ink)}
.loadbar{height:5px;border-radius:5px;background:var(--plum-100);margin-top:16px;overflow:hidden}
.loadbar i{display:block;height:100%;width:38%;border-radius:5px;
  background:linear-gradient(90deg,#9C4DCC,var(--plum-700));animation:slidebar 1.15s var(--ease) infinite}
@keyframes slidebar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
.loadn{font-size:12.5px;color:var(--ink-3);margin-top:12px}

/* ═══ Tiles ═══ */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.tiles.stack{grid-template-columns:1fr;gap:14px}
.tile{--tc:var(--plum-700); --tb:var(--plum-100); --tg:rgba(123,31,162,.20);
  position:relative;text-align:left;width:100%;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:22px 22px 20px;overflow:hidden;
  transition:box-shadow .2s var(--ease),border-color .2s,transform .16s var(--ease)}

function firstSyllable(w){
  const cut = (need) => {
    let c=0,end=-1;
    for(let i=0;i<w.length;i++){
      const ch=w[i];
      if(TH_CONS.indexOf(ch)<0) continue;
      /* อ/ว ที่ตามหลังพยัญชนะทันที มักเป็นสระหรือตัวควบ ไม่นับเป็นพยางค์ใหม่ */
      if(i>0 && (ch==="อ"||ch==="ว") && TH_CONS.indexOf(w[i-1])>=0) continue;

  if(last.length<=1) return s;
  const isThai=/[\u0E00-\u0E7F]/.test(last);

  if(has("รจก."))  return {rank:1, num:numOf(p)};
  if(has("หผ.(ฉ)"))return {rank:2, num:0};
  if(has("นกต."))  return {rank:3, num:numOf(p)};
  if(has("นทน."))  return {rank:4, num:numOf(p)};
  if(has("ผชน."))  return {rank:5, num:numOf(p)};
  if(has("จป.ว.")) return {rank:6, num:numOf(p)};
  if(has("หผ."))   return {rank:7, num:0};
  if(has("ชผ."))   return {rank:8, num:0};
  if(has("นพด."))  return {rank:9, num:numOf(p)};
  if(has("วศก."))  return {rank:10,num:numOf(p)};
  if(has("นบช."))  return {rank:11,num:numOf(p)};
  if(has("นบท"))   return {rank:12,num:numOf(p)};
  if(has("(สข)"))  return {rank:13,num:numOf(p)};
  if(has("(ฮล)"))  return {rank:14,num:numOf(p)};
  if(has("(ปฟ)") && (has("พชง")||has("พบช"))) return {rank:15,num:numOf(p)};
  if(has("พชง.")||has("พบช.")) return {rank:16,num:numOf(p)};
  if(has("ชชง.(ปฟ)")) return {rank:20,num:0};
  if(has("ชชง"))   return {rank:19,num:0};
  if(has("ชบช."))  return {rank:21,num:0};
  if(has("ชบค."))  return {rank:22,num:0};
  if(has("ชพด."))  return {rank:23,num:0};
  if(p.indexOf("คนงาน")===0||p.indexOf("ผู้ปฏิบัติงาน")===0){
    let sub=99; for(const c of WORKER_RANK){ if(has(c.m)){ sub=c.r; break; } }
    return {rank:30,num:sub};
  }
  if(has("พขร."))  return {rank:40,num:0};
  return {rank:98,num:numOf(p)};
}

function sortPersonnel(list){
  return [...list].sort((a,b)=>{
    const gA=getGroup(a.position), gB=getGroup(b.position);   if(gA!==gB) return gA-gB;
    const dA=deptOrder(a.department), dB=deptOrder(b.department); if(dA!==dB) return dA-dB;
    const pA=getPosRank(a.position),  pB=getPosRank(b.position);
    if(pA.rank!==pB.rank) return pA.rank-pB.rank;
    if(pA.num!==pB.num)   return pA.rank===30 ? pA.num-pB.num : pB.num-pA.num;
    return String(a.fullName||"").localeCompare(String(b.fullName||""),"th");
  });
}

/* PDF: render HTML → canvas → jsPDF (รองรับภาษาไทยเต็มรูปแบบ) */
async function exportPDF(node, filename, orientation){
  const canvas = await html2canvas(node, { scale:3, backgroundColor:"#ffffff", useCORS:true, logging:false });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: orientation||"p", unit:"mm", format:"a4" });
  const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
  const m = 8, iw = pw - m*2, ih = canvas.height * iw / canvas.width;
  const img = canvas.toDataURL("image/jpeg", 0.94);
  let left = ih, y = m;
  pdf.addImage(img, "JPEG", m, y, iw, ih, undefined, "FAST");
  left -= (ph - m*2);
  while(left > 1){
    pdf.addPage();
    y = y - (ph - m*2);
    pdf.addImage(img, "JPEG", m, y, iw, ih, undefined, "FAST");
    left -= (ph - m*2);
  }
  pdf.save(filename);
}

/* ── ช่องค้นหาแบบเลือกได้ทันที ── */
function Typeahead({value,onPick,options,placeholder,render,emptyText,allowFree,onChangeText,autoFocus,minChars}){
  const [q,setQ]=useState(value||"");
  const [open,setOpen]=useState(false);
  const [hi,setHi]=useState(0);
  const box=useRef(null);
  useEffect(()=>{ setQ(value||""); },[value]);
  useEffect(()=>{
    const h=(e)=>{ if(box.current && !box.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",h); return ()=>document.removeEventListener("mousedown",h);
  },[]);
  const need = minChars||0;
  const short = q.trim().length < need;               // ยังพิมพ์ไม่ครบจำนวนที่กำหนด
  const list = useMemo(()=>{
    const s=q.trim().toLowerCase();
    if(need && s.length<need) return [];
    const arr = !s ? options : options.filter(o=>String(o.search||o.label).toLowerCase().indexOf(s)>=0);
    return arr.slice(0,60);
  },[q,options,need]);
  const pick=(o)=>{ setQ(o.label); setOpen(false); onPick(o); };
  return (<div className="ta" ref={box}>
    <div style={{position:"relative"}}>
      <input className="inp" value={q} autoFocus={autoFocus} placeholder={placeholder}
        style={{paddingLeft:34}}
        onChange={e=>{ setQ(e.target.value); setOpen(true); setHi(0); if(allowFree&&onChangeText) onChangeText(e.target.value); }}
        onFocus={()=>{ if(!need || q.trim().length>=need) setOpen(true); }}
        onKeyDown={e=>{
          if(e.key==="ArrowDown"){ e.preventDefault(); setOpen(true); setHi(h=>Math.min(h+1,list.length-1)); }
          else if(e.key==="ArrowUp"){ e.preventDefault(); setHi(h=>Math.max(h-1,0)); }
          else if(e.key==="Enter"){ if(open&&list[hi]){ e.preventDefault(); pick(list[hi]); } }
          else if(e.key==="Escape"){ setOpen(false); }
        }}/>
      <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",color:"var(--ink-3)",display:"flex"}}>
        <Ic n="search" s={15}/></span>
    </div>
    {open && (!short || q.trim().length>0) && <div className="ta-list">
      {short
        ? <div className="ta-empty">พิมพ์อย่างน้อย {need} ตัว เพื่อค้นหา</div>
      : list.length===0
        ? <div className="ta-empty">{emptyText||"ไม่พบรายการที่ตรงกัน"}</div>
        : list.map((o,i)=>(<div key={o.key||o.label} className={"ta-item"+(i===hi?" on":"")}
            onMouseEnter={()=>setHi(i)} onMouseDown={e=>{e.preventDefault();pick(o);}}>
            {render ? render(o) : o.label}
          </div>))}
    </div>}
  </div>);
}

  const [free,setFree]=useState(false);

/* ── QR ── */
function QRBlock({url,label,size}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    ref.current.innerHTML="";
    new QRCode(ref.current,{ text:url, width:size||190, height:size||190,
      colorDark:"#3A1147", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M });
  },[url,size]);
  const [dlBusy,setDlBusy]=useState(false);

  /* สร้าง QR ใหม่ที่ความละเอียดสูง พร้อมขอบขาวและชื่อหน่วยงาน สำหรับนำไปพิมพ์ */
  const dl=()=>{
    setDlBusy(true);
    const S=1600;
    const box=document.createElement("div");
    box.style.cssText="position:fixed;left:-99999px;top:0";
    document.body.appendChild(box);
    new QRCode(box,{ text:url, width:S, height:S,
      colorDark:"#000000", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.H });

    const paint=(src)=>{
      const pad=Math.round(S*0.075), cap=Math.round(S*0.15);
      const out=document.createElement("canvas");
      out.width=S+pad*2; out.height=S+pad*2+cap;
      const g=out.getContext("2d");
      g.fillStyle="#ffffff"; g.fillRect(0,0,out.width,out.height);
      g.drawImage(src,pad,pad,S,S);
      g.textAlign="center";
      g.fillStyle="#2A0B3D";
      g.font="700 "+Math.round(cap*0.40)+"px 'Noto Sans Thai',sans-serif";
      g.fillText(label, out.width/2, S+pad*2+cap*0.46);
      g.fillStyle="#5F6368";
      g.font=Math.round(cap*0.24)+"px 'Noto Sans Thai',sans-serif";
      g.fillText("สแกนเพื่อเบิกอุปกรณ์ความปลอดภัยฯ", out.width/2, S+pad*2+cap*0.82);
      const a=document.createElement("a");
      a.href=out.toDataURL("image/png"); a.download="QR-"+label+".png"; a.click();
      box.remove(); setDlBusy(false);
    };

    setTimeout(()=>{
      const cv=box.querySelector("canvas"), im=box.querySelector("img");
      if(cv) paint(cv);
      else if(im){ if(im.complete) paint(im); else im.onload=()=>paint(im); }
      else { box.remove(); setDlBusy(false); }
    },150);
  };
  return (<div style={{textAlign:"center"}}>
    <div className="qrbox"><div ref={ref}></div></div>
    <div style={{fontWeight:700,fontSize:13,marginTop:8}}>{label}</div>
    <div style={{display:"flex",gap:6,justifyContent:"center",marginTop:8}}>
      <button className="btn neutral xs" onClick={dl} disabled={dlBusy}>
        {dlBusy?<span className="spin"></span>:<Ic n="dl" s={12}/>} บันทึก PNG (ความละเอียดสูง)</button>
      <button className="btn neutral xs" onClick={()=>{navigator.clipboard.writeText(url);}}><Ic n="link" s={12}/> คัดลอกลิงก์</button>
    </div>
  </div>);
}


/* ═══════════════ อัปโหลดหลักฐานขึ้น Google Drive ═══════════════
   ผ่าน Apps Script Web App (ดูไฟล์ AppsScript-อัปโหลด.gs)          */
const UPLOAD_URL    = "https://script.google.com/macros/s/AKfycbzs8wczvc02N-wMAmRwKZTjJe8iyOev6mMoIKH07YENTfgca0i5_0teboi1rFqOGS3GEA/exec";
const UPLOAD_TOKEN  = "ppe-lamphun-7Kq2Xm9Vt4Rb8Zn6Wd3";
const REQUIRE_PHOTO = true;    // บังคับแนบรูปถ่ายตอนเบิกของ

/* ย่อรูปก่อนอัปโหลด — ประหยัดพื้นที่ Drive และอัปเร็วขึ้นมาก */
async function shrinkImage(file, maxPx, quality){
  if(file.type==="application/pdf" || file.type.indexOf("image/")<0)
    return { blob:file, mime:file.type||"application/octet-stream", name:file.name };
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{
      const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("อ่านรูปไม่ได้")); i.src=url;
    });
    const sc=Math.min(1,(maxPx||1400)/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",quality||0.78));
    if(!blob) throw new Error("decode");
    return { blob, mime:"image/jpeg", name:String(file.name||"photo").replace(/\.[^.]+$/,"")+".jpg" };
  } catch(e){
    /* เช่น HEIC จาก iPhone ที่เบราว์เซอร์อ่านไม่ได้ — ส่งไฟล์ต้นฉบับขึ้นไปแทน */
    return { blob:file, mime:file.type||"image/jpeg", name:file.name||"photo.jpg" };
  } finally { URL.revokeObjectURL(url); }
}
const blobToB64 = (blob) => new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>res(String(r.result).split(",")[1]);
  r.onerror=()=>rej(new Error("อ่านไฟล์ไม่สำเร็จ"));
  r.readAsDataURL(blob);
});

async function driveUpload(file, folder, prefix){
  if(!uploadReady()) throw new Error("ยังไม่ได้ตั้งค่าที่เก็บไฟล์ (UPLOAD_URL) — ติดต่อแอดมินหลัก");
  const s=await shrinkImage(file,1400,0.78);
  if(s.blob.size > 9*1024*1024) throw new Error("ไฟล์ใหญ่เกิน 9 MB");
  const data=await blobToB64(s.blob);
  const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  const timer = ctrl ? setTimeout(()=>ctrl.abort(), 90000) : null;   /* กันค้างเมื่อสัญญาณไม่ดี */
  let res;
  try{
    res=await fetch(UPLOAD_URL,{
      method:"POST", redirect:"follow", signal: ctrl?ctrl.signal:undefined,
      headers:{ "Content-Type":"text/plain;charset=utf-8" },   /* text/plain = ไม่เกิด CORS preflight */
      body: JSON.stringify({ token:UPLOAD_TOKEN, folder, mime:s.mime,
                             name:(prefix?prefix+"_":"")+s.name, data })
    });
  }catch(e){
    throw new Error((e&&e.name==="AbortError")
      ? "อัปโหลดนานเกินไป สัญญาณอาจไม่ดี — ลองใหม่อีกครั้ง"
      : "เชื่อมต่อเซิร์ฟเวอร์อัปโหลดไม่ได้ ตรวจสอบสัญญาณอินเทอร์เน็ต");
  }finally{ if(timer) clearTimeout(timer); }
  let j; try{ j=await res.json(); }catch(e){ throw new Error("เซิร์ฟเวอร์อัปโหลดตอบกลับผิดรูปแบบ"); }
  if(!j || !j.ok) throw new Error((j&&j.error)||"อัปโหลดไม่สำเร็จ");
  return { id:j.id, name:j.name, mime:s.mime, view:j.view, thumb:j.thumb };
}

/* ── กล้องในหน้าเว็บ — เปิดกล้องได้ตรงๆ ไม่ผ่านตัวเลือกไฟล์ของ Android ── */
function CameraShot({onShot,onClose,onHelp,onDeviceCam,onPhotos}){
  const vid=useRef(null), streamRef=useRef(null);
  const [facing,setFacing]=useState("environment");
  const [ready,setReady]=useState(false);
  const [err,setErr]=useState("");
  const [tick,setTick]=useState(0);

  useEffect(()=>{
    let dead=false;
    const stop=()=>{ if(streamRef.current){ streamRef.current.getTracks().forEach(t=>t.stop()); streamRef.current=null; } };
    (async()=>{
      stop(); setReady(false); setErr("");
      if(IN_APP_BROWSER){
        setErr("inapp"); return;
      }
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        setErr("เบราว์เซอร์นี้เปิดกล้องในหน้าเว็บไม่ได้ กรุณาเปิดด้วย "+(IS_IOS?"Safari":"Chrome")); return;
      }
      try{
        const st=await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1920} }, audio:false });
        if(dead){ st.getTracks().forEach(t=>t.stop()); return; }
        streamRef.current=st;
        if(vid.current){ vid.current.srcObject=st; try{ await vid.current.play(); }catch(e){} }
        setReady(true);
      }catch(e){
        const c=(e&&e.name)||"";
        setErr(c==="NotAllowedError" ? "ยังไม่ได้อนุญาตให้ใช้กล้องในเบราว์เซอร์นี้"
             : c==="NotFoundError"    ? "ไม่พบกล้องบนอุปกรณ์นี้"
             : c==="NotReadableError" ? "กล้องถูกแอปอื่นใช้งานอยู่ — ปิดแอปกล้องแล้วลองใหม่"
             : "เปิดกล้องไม่สำเร็จบนเครื่องนี้");
      }
    })();
    return ()=>{ dead=true; stop(); };
  },[facing,tick]);

  const snap=()=>{
    const v=vid.current; if(!v||!v.videoWidth) return;
    const c=document.createElement("canvas");
    c.width=v.videoWidth; c.height=v.videoHeight;
    c.getContext("2d").drawImage(v,0,0,c.width,c.height);
    c.toBlob(b=>{ if(b) onShot(new File([b],"photo_"+Date.now()+".jpg",{type:"image/jpeg"})); },"image/jpeg",0.92);
  };

  return (<div className="camov">
    <video ref={vid} className="camvid" autoPlay playsInline muted
      style={facing==="user"?{transform:"scaleX(-1)"}:null}></video>
    <div className="camtip">จัดให้เห็นผู้เบิกและอุปกรณ์ที่รับไป แล้วกดปุ่มขาว</div>
    {err && <div className="camerr">
      <Ic n="cam" s={26} c="var(--ink-4)"/>
      <div style={{fontWeight:600,margin:"8px 0 4px",fontSize:16}}>
        {err==="inapp" ? "ต้องเปิดด้วยเบราว์เซอร์จริง" : "เปิดกล้องไม่ได้"}</div>
      <div className="hint" style={{marginBottom:14}}>
        {err==="inapp"
          ? "ตอนนี้เปิดอยู่ในแอป LINE หรือ Facebook ซึ่งไม่อนุญาตให้ใช้กล้องในหน้าเว็บ"
          : err}</div>

      {err==="inapp" && <>
        <button className="btn block" onClick={()=>{ location.href=externalUrl(); }}>
          <Ic n="link" s={15}/> เปิดด้วย Chrome</button>
        <button className="btn neutral block" style={{marginTop:8}}
          onClick={()=>{ navigator.clipboard.writeText(location.href); alert("คัดลอกลิงก์แล้ว — เปิด Chrome แล้ววางลิงก์"); }}>
          คัดลอกลิงก์ไปเปิดเอง</button>
      </>}
      {err!=="inapp" && <button className="btn block" onClick={()=>{ setErr(""); setTick(t=>t+1); }}>
        <Ic n="flip" s={15}/> ลองอีกครั้ง</button>}

      <div className="hr" style={{margin:"14px 0 12px"}}></div>
      <div className="hint" style={{marginBottom:9}}>หรือแนบรูปด้วยวิธีอื่น</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <button className="btn neutral sm" onClick={()=>{ onClose(); onDeviceCam&&onDeviceCam(); }}>
          <Ic n="cam" s={14}/> แอปกล้อง</button>
        <button className="btn neutral sm" onClick={()=>{ onClose(); onPhotos&&onPhotos(); }}>
          <Ic n="img" s={14}/> คลังรูป</button>
      </div>
      <button className="btn neutral sm block" style={{marginTop:8}}
        onClick={()=>{ onClose(); onHelp&&onHelp(); }}>ดูวิธีแก้แบบละเอียด</button>
      <button className="btn neutral sm block" style={{marginTop:8}} onClick={onClose}>ปิด</button>
    </div>}
    <div className="cambar">
      <button className="camrnd" onClick={onClose} aria-label="ปิด"><Ic n="x" s={18}/></button>
      <button className="shutter" onClick={snap} disabled={!ready} aria-label="ถ่ายรูป"></button>
      <button className="camrnd" onClick={()=>setFacing(f=>f==="environment"?"user":"environment")}
        aria-label="สลับกล้อง"><Ic n="flip" s={18}/></button>
    </div>
  </div>);
}

/* ── แนบไฟล์หลายไฟล์ (รูป/PDF) สำหรับหลักฐานการสั่งซื้อ ── */
function AttachBox({files,onChange,max}){
  const ref=useRef(null);
  const cap=max||6;
  return (<div>
    <button className="btn neutral sm" disabled={files.length>=cap} onClick={()=>ref.current.click()}>
      <Ic n="clip" s={14}/> แนบไฟล์ (รูป / PDF)</button>
    <input ref={ref} type="file" multiple accept="image/*,application/pdf" style={{display:"none"}}
      onChange={e=>{ onChange([...files,...Array.from(e.target.files||[])].slice(0,cap)); e.target.value=""; }}/>
    {files.length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:7,marginTop:10}}>
      {files.map((f,i)=>(<span key={i} className="chip n">
        <Ic n={f.type==="application/pdf"?"pdf":"img"} s={12}/>
        <span style={{maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</span>
        <button onClick={()=>onChange(files.filter((_,ix)=>ix!==i))}
          style={{display:"flex",color:"var(--ink-3)"}}><Ic n="x" s={11}/></button>
      </span>))}
    </div>}
  </div>);
}

/* ── ชิปลิงก์ไฟล์แนบที่อัปโหลดแล้ว ── */
function FileChips({files}){
  if(!files || !files.length) return <span style={{color:"var(--ink-4)"}}>—</span>;
  return (<div style={{display:"flex",flexWrap:"wrap",gap:6}}>
    {files.filter(f=>safeUrl(f.view)).map((f,i)=>(<a key={i} className="chip n" href={safeUrl(f.view)} target="_blank" rel="noopener noreferrer"
      style={{textDecoration:"none",maxWidth:180}}>
      <Ic n={f.mime==="application/pdf"?"pdf":"img"} s={12}/>
      <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name||("ไฟล์ "+(i+1))}</span>
    </a>))}
  </div>);
}

/* ═══════════════ หน้า 1 — เข้าสู่ระบบ ═══════════════ */
function Page1Login({accounts}){
  const [pick,setPick]      = useState(null);
  const [loginId,setLoginId]= useState("");
  const [pw,setPw]          = useState("");
  const [remember,setRemember]=useState(true);
  const [err,setErr]        = useState("");
  const [busy,setBusy]      = useState(false);

  const masterIn = async () => {
    setErr(""); setBusy(true);
    try{
      const p=new firebase.auth.GoogleAuthProvider();
      p.setCustomParameters({ prompt:"select_account" });
      const res=await auth.signInWithPopup(p);
      if(String(res.user.email||"").toLowerCase()!==MASTER_EMAIL){
        await auth.signOut();
        setErr("บัญชี "+res.user.email+" ไม่ใช่แอดมินหลักของระบบ");
      }
    }catch(e){ setErr(authErr(e)); }
    setBusy(false);
  };

  const officeIn = async () => {
    setErr("");
    const id=onlyDigits(loginId);
    if(id.length!==ID_LEN){ setErr("ID ต้องเป็นตัวเลข "+ID_LEN+" หลัก"); return; }
    if(!pw){ setErr("กรอกรหัสผ่าน"); return; }
    const acc=accounts[pick.id];
    if(!acc){ setErr("หน่วยงานนี้ยังไม่ได้ตั้งบัญชี"); return; }
    setBusy(true);
    try{
      const res=await auth.signInWithEmailAndPassword(authEmailOf(id,acc.ver),pw);
      if(acc.uid!==res.user.uid){
        await auth.signOut();
        setErr("ID นี้ไม่มีสิทธิ์เข้า "+pick.name);
      } else {
        idMem.set(pick.id, remember ? id : "");
      }
    }catch(e){ setErr(authErr(e)); }
    setBusy(false);
  };

  return (<Shell
    title="ระบบจัดการอุปกรณ์ความปลอดภัยฯ"
    sub="กฟจ.ลำพูน และ กฟส.ในสังกัด"
    right={<button className="btn onplum sm" onClick={()=>go("accounts")}>
      <Ic n="wrench" s={15}/> จัดการบัญชีผู้ใช้</button>}>

    <div className="hero">
      <div className="hero-b">
        <div className="hero-k">การไฟฟ้าส่วนภูมิภาคจังหวัดลำพูน</div>
        <div className="hero-t">ระบบควบคุมสต๊อกและการเบิกจ่าย<br/>อุปกรณ์ความปลอดภัยส่วนบุคคล</div>
        <div className="hero-d">เลือกหน่วยงานของท่านด้านล่างเพื่อเข้าใช้งาน</div>
      </div>
      <div className="hero-a">
        <button className="btn onhero lg" onClick={masterIn} disabled={busy}>
          {busy?<span className="spin"></span>:<Ic n="google" s={18} c="#7B1FA2"/>} Master Login</button>
        <button className="btn onhero2" onClick={()=>go("dashboard")}>
          <Ic n="chart" s={15}/> Dashboard ประวัติการเบิกจ่าย</button>
      </div>
    </div>

    <div className="sec-head"><h2>เข้าสู่ระบบรายหน่วยงาน</h2>
      <div className="tb-spacer"></div>
      <span className="chip n">{OFFICES.filter(o=>accounts[o.id]).length} / {OFFICES.length} พร้อมใช้งาน</span>
    </div>
    <div className="ofgrid">
      {OFFICES.map((o,i)=>{
        const has=!!accounts[o.id];
        return (<button key={o.id} className="ofcard" disabled={!has}
          onClick={()=>{ const m=idMem.get(o.id); setErr(""); setPw(""); setLoginId(m); setRemember(!!m||true); setPick(o); }}>
          <span className="ofn">{String(i+1).padStart(2,"0")}</span>
          <span className="ofb">
            <span className="ofnm">{o.name}</span>
            <span className={"ofst"+(has?" on":"")}>
              <i></i>{has?"พร้อมใช้งาน":"ยังไม่ได้ตั้งบัญชี"}</span>
          </span>
          {has && <span className="ofgo"><Ic n="chev" s={17}/></span>}
        </button>);
      })}
    </div>

    {pick && <Modal title={"เข้าสู่ระบบ · "+pick.name}
      onClose={()=>{setPick(null);setErr("");}}
      footer={<>
        <button className="btn neutral" onClick={()=>{setPick(null);setErr("");}}>ยกเลิก</button>
        <button className="btn" onClick={officeIn} disabled={busy}>
          {busy&&<span className="spin" style={{borderColor:"rgba(255,255,255,.4)",borderTopColor:"#fff"}}></span>} เข้าสู่ระบบ</button>
      </>}>
      <Msg kind="e">{err}</Msg>
      <form onSubmit={e=>{ e.preventDefault(); officeIn(); }}>
        <input type="hidden" name="office" value={pick.name} autoComplete="organization"/>
        <div className="field"><label className="lbl" htmlFor="ppe-id">ID</label>
          <input id="ppe-id" name="username" className="inp mono" inputMode="numeric" autoFocus
            autoComplete="username" placeholder={"ตัวเลข "+ID_LEN+" หลัก"} value={loginId}
            onChange={e=>setLoginId(onlyDigits(e.target.value).slice(0,ID_LEN))}/></div>
        <div className="field"><label className="lbl" htmlFor="ppe-pw">รหัสผ่าน</label>
          <input id="ppe-pw" name="password" className="inp" type="password" value={pw}
            autoComplete="current-password" onChange={e=>setPw(e.target.value)}/></div>
        <label className="checkbox" style={{marginBottom:4}}>
          <input type="checkbox" checked={remember} onChange={e=>setRemember(e.target.checked)}/>
          จำ ID ไว้ในเครื่องนี้</label>
        <button type="submit" style={{position:"absolute",left:-9999,width:1,height:1}} aria-hidden="true"/>
      </form>
    </Modal>}

    {err && !pick && <div style={{maxWidth:640,margin:"18px auto 0"}}><Msg kind="e">{err}</Msg></div>}
  </Shell>);
}

function authErr(e){
  const c=(e&&e.code)||"";
  const M={
    "auth/invalid-credential":"ID หรือรหัสผ่านไม่ถูกต้อง",
    "auth/wrong-password":"ID หรือรหัสผ่านไม่ถูกต้อง",
    "auth/user-not-found":"ไม่พบ ID นี้ในระบบ",
    "auth/invalid-email":"รูปแบบ ID ไม่ถูกต้อง",
    "auth/too-many-requests":"ลองผิดหลายครั้งเกินไป กรุณารอสักครู่",
    "auth/network-request-failed":"เชื่อมต่ออินเทอร์เน็ตไม่ได้",
    "auth/popup-closed-by-user":"ปิดหน้าต่างล็อกอินก่อนเสร็จ",
    "auth/popup-blocked":"เบราว์เซอร์บล็อกป๊อปอัป — อนุญาตแล้วลองใหม่",
    "auth/operation-not-allowed":"ยังไม่ได้เปิดวิธีล็อกอินนี้ใน Firebase Console",
    "auth/weak-password":"รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร",
    "auth/email-already-in-use":"ID นี้ถูกใช้แล้ว"
  };
  return M[c] || ("ดำเนินการไม่สำเร็จ: "+((e&&e.message)||c));
}

/* ═══════════════ หน้า 2 — จัดการบัญชีผู้ใช้ ═══════════════ */
function Page2Accounts({accounts,isMaster,user}){
  const [ids,setIds]  = useState({});
  const [edit,setEdit]= useState(null);
  const [lid,setLid]  = useState("");
  const [pw,setPw]    = useState("");
  const [busy,setBusy]= useState(false);
  const [err,setErr]  = useState("");
  const [ok,setOk]    = useState("");

  useEffect(()=>{
    if(!isMaster) return;
    const r=R("accountIds");
    const cb=r.on("value",s=>setIds(s.val()||{}),()=>{});
    return ()=>r.off("value",cb);
  },[isMaster]);

  const flash=(t)=>{ setOk(t); setTimeout(()=>setOk(""),4500); };
  const idOf =(oid)=> (ids[oid]&&ids[oid].loginId)||"";
  const open =(o)=>{ setEdit(o); setLid(idOf(o.id)); setPw(""); setErr(""); };

  const save=async()=>{
    setErr("");
    const id=onlyDigits(lid);
    if(id.length!==ID_LEN){ setErr("ID ต้องเป็นตัวเลข "+ID_LEN+" หลัก (ตอนนี้ "+id.length+" หลัก)"); return; }
    if(!pw||pw.length<6){ setErr("รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร"); return; }
    const dup=Object.entries(ids).find(([oid,v])=>oid!==edit.id && v && v.loginId===id);
    if(dup){ setErr("ID นี้ใช้กับ "+OFC[dup[0]]+" อยู่แล้ว"); return; }

    setBusy(true);
    const sec=secondaryAuth();
    try{
      const cur=accounts[edit.id];
      let uid=null, ver=null;

      /* ID + รหัสผ่านเดิม → ใช้บัญชีเดิมต่อ ไม่ต้องสร้างใหม่ */
      if(cur && cur.ver){
        try{
          const c=await sec.signInWithEmailAndPassword(authEmailOf(id,cur.ver),pw);
          uid=c.user.uid; ver=cur.ver;
        }catch(ignore){}
      }
      /* เปลี่ยนรหัสผ่าน หรือ ตั้งค่าครั้งแรก → สร้างบัญชีรุ่นถัดไปให้ ID เดิม */
      if(uid===null){
        let v=((cur&&cur.ver)||0)+1;
        for(let i=0;i<6 && uid===null;i++,v++){
          try{
            const c=await sec.createUserWithEmailAndPassword(authEmailOf(id,v),pw);
            uid=c.user.uid; ver=v;
          }catch(e){
            const code=e.code||"";
            if(code==="auth/weak-password"||code==="auth/operation-not-allowed") throw e;
          }
        }
        if(uid===null) throw new Error("สร้างบัญชีไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
      }
      await sec.signOut();
      const oldUid = cur && cur.uid;
      const upd = {
        ["accounts/"+edit.id]  :{ ver, uid, updatedAt:nowTs() },
        ["accountIds/"+edit.id]:{ loginId:id, updatedAt:nowTs(), updatedBy:user.email },
        ["admins/"+uid]        : edit.id
      };
      if(oldUid && oldUid!==uid) upd["admins/"+oldUid]=null;   // เพิกถอนบัญชีรุ่นเก่า
      await R("").update(upd);
      setEdit(null); flash("บันทึกบัญชีของ "+edit.name+" แล้ว");
    }catch(e){ setErr(authErr(e)); }
    setBusy(false);
  };

  const revoke=async(o)=>{
    if(!confirm("ยกเลิกสิทธิ์ของ "+o.name+" ?")) return;
    const a=accounts[o.id];
    const upd={ ["accounts/"+o.id]:null, ["accountIds/"+o.id]:null };
    if(a && a.uid) upd["admins/"+a.uid]=null;
    await R("").update(upd);
    flash("ยกเลิกสิทธิ์ "+o.name+" แล้ว");
  };

  if(!isMaster) return (<Shell title="จัดการบัญชีผู้ใช้" crumbs={[{t:"หน้าหลัก",to:""},{t:"จัดการบัญชีผู้ใช้"}]}>
    <div className="card card-p" style={{marginTop:20}}>
      <Msg kind="e">หน้านี้เข้าได้เฉพาะแอดมินหลัก</Msg>
      <button className="btn" onClick={()=>go("")}>กลับหน้าเข้าสู่ระบบ</button>
    </div></Shell>);

  return (<Shell title="จัดการบัญชีผู้ใช้"
    right={<button className="btn onplum sm" onClick={()=>go("")}><Ic n="back" s={15}/> หน้าหลัก</button>}
    crumbs={[{t:"หน้าหลัก",to:""},{t:"จัดการบัญชีผู้ใช้"}]}>

    {ok && <div style={{marginTop:14}}><Msg kind="s">{ok}</Msg></div>}

    <div className="tblwrap" style={{marginTop:14}}>
      <table className="t">
        <thead><tr>
          <th style={{width:40}}>#</th><th>หน่วยงาน</th><th style={{width:250}}>ID เข้าใช้งาน</th>
          <th style={{width:118}}>สถานะ</th><th style={{width:210}}></th>
        </tr></thead>
        <tbody>{OFFICES.map((o,i)=>{
          const a=accounts[o.id], id=idOf(o.id);
          return (<tr key={o.id}>
            <td className="mono" style={{color:"var(--ink-3)"}}>{i+1}</td>
            <td style={{fontWeight:500}}>{o.name}</td>
            <td>{id
              ? <span style={{display:"inline-flex",alignItems:"center",gap:7}}>
                  <span className="mono" style={{fontSize:12.5}}>{groupId(id)}</span>
                  <button className="iconbtn" title="คัดลอก ID"
                    onClick={()=>{navigator.clipboard.writeText(id);flash("คัดลอก ID ของ "+o.name+" แล้ว");}}>
                    <Ic n="copy" s={12}/></button>
                </span>
              : <span style={{color:"var(--ink-4)"}}>—</span>}</td>
            <td>{a?<span className="chip g"><Ic n="check" s={11}/> ใช้งานได้</span>:<span className="chip n">ปิดอยู่</span>}</td>
            <td><div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
              <button className="btn ghost xs" onClick={()=>open(o)}>
                <Ic n="pen" s={12}/> {a?"แก้ไข":"ตั้งค่า"}</button>
              {a && <button className="btn bad xs" onClick={()=>revoke(o)}><Ic n="x" s={11}/> ยกเลิกสิทธิ์</button>}
            </div></td>
          </tr>);
        })}</tbody>
      </table>
    </div>

    {edit && <Modal title={"ตั้งค่าบัญชี · "+edit.name} onClose={()=>setEdit(null)}
      footer={<>
        <button className="btn neutral" onClick={()=>setEdit(null)}>ยกเลิก</button>
        <button className="btn" onClick={save} disabled={busy}>
          {busy&&<span className="spin" style={{borderColor:"rgba(255,255,255,.4)",borderTopColor:"#fff"}}></span>} บันทึก</button>
      </>}>
      <Msg kind="e">{err}</Msg>
      <div className="field">
        <label className="lbl">ID เข้าใช้งาน <span className="req">*</span></label>
        <input className="inp mono" inputMode="numeric" autoFocus value={groupId(lid)}
          placeholder={"ตัวเลข "+ID_LEN+" หลัก"} style={{letterSpacing:".03em"}}
          onChange={e=>setLid(onlyDigits(e.target.value).slice(0,ID_LEN))}/>
        <div className="hint" style={{marginTop:5}}>{onlyDigits(lid).length}/{ID_LEN} หลัก</div>
      </div>
      <div className="field">
        <label className="lbl">รหัสผ่าน <span className="req">*</span></label>
        <input className="inp mono" type="text" value={pw} placeholder="อย่างน้อย 6 ตัวอักษร"
          onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()}/>
      </div>
    </Modal>}
  </Shell>);
}
