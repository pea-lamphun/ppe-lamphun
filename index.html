      <button className="tile teal" onClick={()=>go("office/"+office.id+"/roster")}>
        <div className="tile-ic"><Ic n="users" s={23}/></div>
        <div className="tile-t">จัดการรายชื่อ</div>
        <div className="tile-d">รายชื่อพนักงานของหน่วยงาน</div>
        <span className="tile-go"><Ic n="chev" s={17}/></span>
      </button>
      <button className="tile plum" onClick={()=>go("office/"+office.id+"/items")}>
        <div className="tile-ic"><Ic n="box" s={23}/></div>
        <div className="tile-t">จัดการรายการอุปกรณ์ความปลอดภัยฯ</div>
        <div className="tile-d">เติมของเข้าคลัง และดูของคงเหลือ</div>
        <span className="tile-go"><Ic n="chev" s={17}/></span>
      </button>
      <button className="tile amber" onClick={()=>go("dashboard")}>
        <div className="tile-ic"><Ic n="chart" s={23}/></div>
        <div className="tile-t">ตรวจสอบประวัติการเบิกจ่าย</div>
        <div className="tile-d">ค้นหาย้อนหลังทุกหน่วยงาน</div>
        <span className="tile-go"><Ic n="chev" s={17}/></span>
      </button>
    </div>

    <div className="sec-head"><h2>QR Code สำหรับพนักงานเบิกของ</h2></div>
    <div className="card card-p" style={{display:"flex",gap:22,alignItems:"center",flexWrap:"wrap"}}>
      <QRBlock url={wUrl} label={office.name} size={160}/>
      <div style={{flex:1,minWidth:230}}>
        <div className="urlbox">{wUrl}</div>
        <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
          <button className="btn ghost sm" onClick={()=>window.open(wUrl,"_blank")}>
            <Ic n="link" s={14}/> เปิดหน้าเบิกของ</button>
          <button className="btn neutral sm" onClick={()=>navigator.clipboard.writeText(wUrl)}>
            <Ic n="copy" s={14}/> คัดลอกลิงก์</button>
        </div>
      </div>
    </div>
  </Shell>);
}

/* ═══════════════ หน้า 4 — จัดการรายชื่อ ═══════════════ */
function Page4Roster({office,people}){
  const [form,setForm]   = useState({empId:"",fullName:"",position:"",department:""});
  const [editId,setEditId]=useState(null);
  const [show,setShow]   = useState(false);
  const [q,setQ]         = useState("");
  const [censor,setCensor]=useState(true);
  const [msg,setMsg]     = useState("");
  const [err,setErr]     = useState("");
  const fileRef=useRef(null);
  const [plan,setPlan]     = useState(null);   // ผลตรวจไฟล์ก่อนยืนยัน
  const [doUpd,setDoUpd]   = useState(true);
  const [doDel,setDoDel]   = useState(false);
  const [imBusy,setImBusy] = useState(false);
  const base = "offices/"+office.id+"/people";

  const list = useMemo(()=>{
    const arr=Object.entries(people||{}).map(([id,p])=>({id,...p}));
    const s=q.trim().toLowerCase();
    const f=!s?arr:arr.filter(p=>
      (p.fullName||"").toLowerCase().indexOf(s)>=0 ||
      (p.empId||"").toLowerCase().indexOf(s)>=0 ||
      (p.position||"").toLowerCase().indexOf(s)>=0 ||
      (p.department||"").toLowerCase().indexOf(s)>=0);
    return sortPersonnel(f);
  },[people,q]);

  const flash=(t)=>{ setMsg(t); setTimeout(()=>setMsg(""),4000); };
  const reset=()=>{ setForm({empId:"",fullName:"",position:"",department:""}); setEditId(null); setShow(false); setErr(""); };

  const save=async()=>{
    setErr("");
    if(!form.fullName.trim()){ setErr("กรอกชื่อ-นามสกุล"); return; }
    if(!form.empId.trim()){ setErr("กรอกรหัสประจำตัว — ใช้เป็นรหัสที่พนักงานพิมพ์ตอนเบิกของ"); return; }
    const dup=Object.entries(people||{}).find(([id,p])=>id!==editId && String(p.empId||"").trim()===form.empId.trim());
    if(dup){ setErr("รหัสประจำตัว "+form.empId+" ซ้ำกับ "+dup[1].fullName); return; }
    const data={ empId:form.empId.trim(), fullName:form.fullName.trim(),
                 position:form.position.trim(), department:form.department.trim(),
                 selfAdded:null, addedAt:null };   /* ตรวจสอบแล้ว ล้างป้ายกำกับ */
    if(editId) await R(base+"/"+editId).update(data);
    else       await R(base).push(data);
    flash(editId?"บันทึกการแก้ไขแล้ว":"เพิ่มรายชื่อแล้ว"); reset();
  };

  const del=async(p)=>{
    if(!confirm("ลบ “"+p.fullName+"” ออกจากรายชื่อ?")) return;
    await R(base+"/"+p.id).remove(); flash("ลบรายชื่อแล้ว");
  };
  const delAll=async()=>{
    const n=Object.keys(people||{}).length;
    if(!n) return;
    if(!confirm("ลบรายชื่อทั้งหมดของ "+office.name+" ("+n+" คน)?\n\nประวัติการเบิกจ่ายเดิมจะยังอยู่")) return;
    await R(base).remove(); flash("ลบรายชื่อทั้งหมดแล้ว");
  };

  const FIELDS=[["fullName","ชื่อ-นามสกุล"],["position","ตำแหน่ง"],["department","สังกัด"],["empId","รหัสประจำตัว"]];

  const doImport=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=(ev)=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false});
        if(rows.length<2){ setErr("ไม่พบข้อมูลในไฟล์"); return; }
        const hd=rows[0].map(h=>String(h||"").toLowerCase().trim());
        const col=(...k)=>{ for(const key of k){ const i=hd.findIndex(h=>h.indexOf(key)>=0); if(i>=0) return i; } return -1; };
        const cId=col("รหัส","emp","id"), cNm=col("ชื่อ","name"),
              cPo=col("ตำแหน่ง","position"), cDe=col("สังกัด","แผนก","dept");
        if(cNm<0){ setErr("ไม่พบคอลัมน์ “ชื่อ-นามสกุล” ในไฟล์"); return; }

        /* ทะเบียนที่มีอยู่เดิม */
        const cur=Object.entries(people||{}).map(([id,p])=>({id,...p}));
        const byId={}, byName={};
        cur.forEach(p=>{
          const k=String(p.empId||"").trim();
          if(k) byId[k]=p;
          const nk=String(p.fullName||"").trim();
          if(nk && !byName[nk]) byName[nk]=p;
        });

        /* อ่านไฟล์ + ตัดแถวซ้ำภายในไฟล์เอง */
        const seen={}; let dupFile=0, blank=0;
        const fileRows=[];
        for(let i=1;i<rows.length;i++){
          const r=rows[i]; const nm=String((r&&r[cNm])||"").trim();
          if(!nm){ blank++; continue; }
          const rec={ empId:cId>=0?String(r[cId]||"").trim():"", fullName:nm,
                      position:cPo>=0?String(r[cPo]||"").trim():"",
                      department:cDe>=0?String(r[cDe]||"").trim():"" };
          const key=rec.empId||("~"+nm);
          if(seen[key]!==undefined){ fileRows[seen[key]]=rec; dupFile++; continue; }
          seen[key]=fileRows.length; fileRows.push(rec);
        }

        const add=[], upd=[]; let same=0, noId=0;
        const touched={};
        fileRows.forEach(rec=>{
          const hit = (rec.empId && byId[rec.empId]) || byName[rec.fullName] || null;
          if(!rec.empId) noId++;
          if(!hit){ add.push(rec); return; }
          touched[hit.id]=true;
          const next={ empId:rec.empId||hit.empId||"", fullName:rec.fullName,
                       position:rec.position, department:rec.department };
          const diffs=FIELDS.filter(([k])=>String(hit[k]||"")!==String(next[k]||""))
                            .map(([k,label])=>({k,label,from:hit[k]||"—",to:next[k]||"—"}));
          if(diffs.length) upd.push({ id:hit.id, name:hit.fullName, next, diffs });
          else same++;
        });
        const missing=cur.filter(p=>!touched[p.id]);

        if(!add.length && !upd.length && !missing.length){
          setErr(""); flash("ข้อมูลในไฟล์ตรงกับระบบอยู่แล้ว ("+same+" คน) ไม่มีอะไรต้องเปลี่ยน");
          return;
        }
        setErr(""); setDoUpd(true); setDoDel(false);
        setPlan({ add, upd, same, missing, noId, dupFile, blank, total:fileRows.length });
      }catch(ex){ setErr("อ่านไฟล์ไม่สำเร็จ: "+ex.message); }
    };
    rd.readAsArrayBuffer(f); e.target.value="";
  };

  const runImport=async()=>{
    if(!plan) return;
    setImBusy(true);
    try{
      const u={};
      plan.add.forEach(a=>{ u[R(base).push().key]=a; });
      if(doUpd) plan.upd.forEach(x=>{ u[x.id]=x.next; });
      if(doDel) plan.missing.forEach(m=>{ u[m.id]=null; });
      if(Object.keys(u).length) await R(base).update(u);
      const parts=[];
      if(plan.add.length) parts.push("เพิ่ม "+plan.add.length);
      if(doUpd && plan.upd.length) parts.push("อัปเดต "+plan.upd.length);
      if(doDel && plan.missing.length) parts.push("ลบ "+plan.missing.length);
      flash("นำเข้าเรียบร้อย · "+(parts.join(" · ")||"ไม่มีการเปลี่ยนแปลง"));
      setPlan(null);
    }catch(ex){ setErr("บันทึกไม่สำเร็จ: "+ex.message); }
    setImBusy(false);
  };

  const doExport=()=>{
    if(!list.length) return;
    exportXLSX(list.map((p,i)=>({
      "ลำดับ":i+1, "รหัสประจำตัว":p.empId||"",
      "ชื่อ-นามสกุล":censor?censorName(p.fullName):p.fullName,
      "ตำแหน่ง":p.position||"", "สังกัด":p.department||""
    })),"รายชื่อ","รายชื่อพนักงาน-"+office.name+(censor?"-เซ็นเซอร์":"")+".xlsx",[7,15,32,20,14]);
  };

  return (<Shell title="จัดการรายชื่อ" sub={office.name}
    right={<button className="btn onplum sm" onClick={()=>go("office/"+office.id)}><Ic n="back" s={15}/> ย้อนกลับ</button>}
    crumbs={[{t:"หน้าหลัก",to:""},{t:office.name,to:"office/"+office.id},{t:"จัดการรายชื่อ"}]}>

    {msg && <Msg kind="s">{msg}</Msg>}
    {err && <Msg kind="e">{err}</Msg>}

    {list.filter(p=>p.selfAdded).length>0 && <Msg kind="i"><div>
      มี {list.filter(p=>p.selfAdded).length} รายชื่อที่พนักงานกรอกเองตอนมาเบิกของ —
      กดแก้ไขเพื่อตรวจสอบและเติมข้อมูลให้ครบ ป้าย “เพิ่มเอง” จะหายไปเอง</div></Msg>}

    <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
      <button className="btn" onClick={()=>{reset();setShow(true);}}><Ic n="plus" s={15}/> เพิ่มรายชื่อ</button>
      <button className="btn ghost" onClick={()=>fileRef.current.click()}><Ic n="up2" s={15}/> นำเข้ารายชื่อ</button>
      <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={doImport}/>
      <button className="btn ghost" onClick={doExport} disabled={!list.length}><Ic n="dl" s={15}/> ส่งออกรายชื่อ</button>
      <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:600,color:"var(--ink-2)",
        background:"#fff",border:"1px solid var(--line)",borderRadius:8,padding:"7px 11px",cursor:"pointer"}}>
        <input type="checkbox" checked={censor} onChange={e=>setCensor(e.target.checked)}/> เซ็นเซอร์นามสกุล
      </label>
      <div className="tb-spacer"></div>
      {list.length>0 && <button className="btn bad sm" onClick={delAll}><Ic n="trash" s={12}/> ลบทั้งหมด</button>}
    </div>

    <div style={{marginBottom:12,maxWidth:380}}>
      <input className="inp" placeholder="ค้นหาชื่อ หรือรหัส…" value={q} onChange={e=>setQ(e.target.value)}/>
    </div>

    <div className="tblwrap">
      {list.length===0
        ? <Empty icon="users" title="ยังไม่มีรายชื่อ" desc="กดเพิ่มรายชื่อ หรือนำเข้าจากไฟล์ Excel"/>
        : <table className="t"><thead><tr>
            <th style={{width:40}}>#</th><th style={{width:110}}>รหัส</th><th>ชื่อ-นามสกุล</th>
            <th style={{width:130}}>ตำแหน่ง</th><th style={{width:100}}>สังกัด</th><th style={{width:82}}></th>
          </tr></thead><tbody>
          {list.map((p,i)=>(<tr key={p.id}>
            <td className="mono" style={{color:"var(--ink-3)"}}>{i+1}</td>
            <td className="mono" style={{fontSize:12.5}}>{p.empId||"-"}</td>
            <td style={{fontWeight:600}}>{censor?censorName(p.fullName):p.fullName}
              {p.selfAdded && <span className="chip w" style={{marginLeft:8,fontSize:11}}>เพิ่มเอง</span>}</td>
            <td style={{fontSize:12.5,color:"var(--ink-2)"}}>{p.position||"-"}</td>
            <td style={{fontSize:12.5,color:"var(--ink-2)"}}>{p.department||"-"}</td>
            <td><div style={{display:"flex",gap:5,justifyContent:"flex-end"}}>
              <button className="iconbtn" title="แก้ไข" onClick={()=>{
                setEditId(p.id); setForm({empId:p.empId||"",fullName:p.fullName||"",
                  position:p.position||"",department:p.department||""}); setShow(true); setErr("");
              }}><Ic n="pen" s={13}/></button>
              <button className="iconbtn danger" title="ลบ" onClick={()=>del(p)}><Ic n="trash" s={13}/></button>
            </div></td>
          </tr>))}
        </tbody></table>}
    </div>
    <div className="hint" style={{marginTop:8}}>รวม {list.length} คน</div>

    {plan && <Modal wide title="ตรวจสอบก่อนนำเข้า" sub={"อ่านจากไฟล์ได้ "+plan.total+" รายชื่อ"}
      onClose={()=>setPlan(null)}
      footer={<>
        <button className="btn neutral" onClick={()=>setPlan(null)}>ยกเลิก</button>
        <button className="btn" onClick={runImport} disabled={imBusy}>
          {imBusy&&<span className="spin" style={{borderColor:"rgba(255,255,255,.4)",borderTopColor:"#fff"}}></span>}
          ยืนยันนำเข้า</button>
      </>}>

      <div className="grid4" style={{marginBottom:16}}>
        {[["เพิ่มใหม่",plan.add.length,"#0D8577","#E1F4F1"],
          ["ข้อมูลเปลี่ยน",plan.upd.length,"#C2610C","#FDF0E2"],
          ["เหมือนเดิม",plan.same,"#5F6368","#F1F3F4"],
          ["ไม่มีในไฟล์",plan.missing.length,"#7B1FA2","#F5EAFA"]].map(([t,v,c,bg])=>(
          <div key={t} style={{background:bg,borderRadius:10,padding:"12px 14px"}}>
            <div style={{fontSize:12,color:"var(--ink-2)"}}>{t}</div>
            <div className="mono" style={{fontSize:24,fontWeight:600,color:c,lineHeight:1.2}}>{v}</div>
          </div>))}
      </div>

      {(plan.noId>0 || plan.dupFile>0) && <Msg kind="i">
        <div>
          {plan.dupFile>0 && <>ไฟล์มีรหัสซ้ำกันเอง {plan.dupFile} แถว — ใช้แถวล่างสุดเป็นหลัก<br/></>}
          {plan.noId>0 && <>มี {plan.noId} แถวที่ไม่มีรหัสประจำตัว ระบบจับคู่ด้วยชื่อแทน คนกลุ่มนี้จะเบิกของไม่ได้จนกว่าจะใส่รหัส</>}
        </div></Msg>}

      {plan.add.length>0 && <div style={{marginBottom:14}}>
        <div className="lbl">เพิ่มใหม่ {plan.add.length} คน</div>
        <div className="tblwrap" style={{maxHeight:180,overflowY:"auto"}}>
          <table className="t"><tbody>
            {plan.add.slice(0,100).map((a,i)=>(<tr key={i}>
              <td className="mono" style={{width:100,fontSize:12.5}}>{a.empId||"—"}</td>
              <td style={{fontWeight:500}}>{a.fullName}</td>
              <td style={{fontSize:12.5,color:"var(--ink-3)"}}>{a.position||"—"}</td>
            </tr>))}
          </tbody></table></div>
        {plan.add.length>100 && <div className="hint" style={{marginTop:5}}>แสดง 100 แถวแรก</div>}
      </div>}

      {plan.upd.length>0 && <div style={{marginBottom:14}}>
        <label className="checkbox" style={{marginBottom:8}}>
          <input type="checkbox" checked={doUpd} onChange={e=>setDoUpd(e.target.checked)}/>
          อัปเดตข้อมูลที่เปลี่ยนแปลง {plan.upd.length} คน</label>
        <div className="tblwrap" style={{maxHeight:200,overflowY:"auto"}}>
          <table className="t"><tbody>
            {plan.upd.slice(0,100).map((x,i)=>(<tr key={i}>
              <td style={{fontWeight:500,width:190}}>{x.name}</td>
              <td>{x.diffs.map((d,j)=>(<div key={j} style={{fontSize:12.5,padding:"1px 0"}}>
                <span style={{color:"var(--ink-3)"}}>{d.label}: </span>
                <span style={{color:"var(--bad)",textDecoration:"line-through"}}>{d.from}</span>
                <span style={{color:"var(--ink-3)"}}> → </span>
                <span style={{color:"var(--ok)",fontWeight:600}}>{d.to}</span>
              </div>))}</td>
            </tr>))}
          </tbody></table></div>
      </div>}

      {plan.missing.length>0 && <div>
        <label className="checkbox" style={{marginBottom:8}}>
          <input type="checkbox" checked={doDel} onChange={e=>setDoDel(e.target.checked)}/>
          ลบคนที่ไม่มีในไฟล์นี้ออกจากระบบ {plan.missing.length} คน</label>
        <div className="tblwrap" style={{maxHeight:160,overflowY:"auto"}}>
          <table className="t"><tbody>
            {plan.missing.slice(0,100).map((m,i)=>(<tr key={i}>
              <td className="mono" style={{width:100,fontSize:12.5}}>{m.empId||"—"}</td>
              <td style={{fontWeight:500}}>{m.fullName}</td>
              <td style={{fontSize:12.5,color:"var(--ink-3)"}}>{m.position||"—"}</td>
            </tr>))}
          </tbody></table></div>
        <div className="hint" style={{marginTop:6}}>
          ถ้าไม่ติ๊ก คนกลุ่มนี้จะยังอยู่ในระบบตามเดิม · ประวัติการเบิกจ่ายเดิมจะไม่ถูกลบไม่ว่ากรณีใด</div>
      </div>}
    </Modal>}

    {show && <Modal title={editId?"แก้ไขรายชื่อ":"เพิ่มรายชื่อ"} sub={office.name} onClose={reset}
      footer={<><button className="btn neutral" onClick={reset}>ยกเลิก</button>
              <button className="btn" onClick={save}>บันทึก</button></>}>
      <Msg kind="e">{err}</Msg>
      <div className="grid2">
        <div className="field"><label className="lbl">รหัสประจำตัว <span className="req">*</span></label>
          <input className="inp mono" value={form.empId} autoFocus
            onChange={e=>setForm({...form,empId:e.target.value})}/></div>
        <div className="field"><label className="lbl">ชื่อ-นามสกุล <span className="req">*</span></label>
          <input className="inp" value={form.fullName} placeholder="นายเกียรติพงษ์ นุ่มนวล"
            onChange={e=>setForm({...form,fullName:e.target.value})}/></div>
        <div className="field"><label className="lbl">ตำแหน่ง</label>
          <input className="inp" value={form.position} placeholder="เช่น พชง.6, ชชง., คนงาน (ก่อสร้าง 1)"
            onChange={e=>setForm({...form,position:e.target.value})}/></div>
        <div className="field"><label className="lbl">สังกัด / แผนก</label>
          <input className="inp" value={form.department} placeholder="เช่น ผกส., ผปบ."
            onChange={e=>setForm({...form,department:e.target.value})}/></div>
      </div>
      {form.fullName.trim() && <div className="hint">แสดงบนหน้าสาธารณะเป็น: <b>{censorName(form.fullName)}</b></div>}
    </Modal>}
  </Shell>);
}

/* ═══════════════ หน้า 5 — จัดการรายการอุปกรณ์ความปลอดภัยฯ ═══════════════ */
function Page5Items({office,stock}){
  const n=Object.values(stock||{}).filter(s=>(s.qty||0)>0).length;
  return (<Shell title="จัดการรายการอุปกรณ์ความปลอดภัยฯ" sub={office.name}
    right={<button className="btn onplum sm" onClick={()=>go("office/"+office.id)}><Ic n="back" s={15}/> ย้อนกลับ</button>}
    crumbs={[{t:"หน้าหลัก",to:""},{t:office.name,to:"office/"+office.id},{t:"จัดการรายการอุปกรณ์ฯ"}]}>
    <div className="tiles stack" style={{marginTop:14,maxWidth:760}}>
      <button className="tile row teal" onClick={()=>go("office/"+office.id+"/stock-in")}>
        <div className="tile-ic"><Ic n="plus" s={24}/></div>
        <div className="tile-body">
          <div className="tile-t">เพิ่มรายการเข้าคลัง</div>
          <div className="tile-d">บันทึกของที่รับเข้าคลัง พร้อมแนบเอกสารการสั่งซื้อ</div>
        </div>
        <span className="tile-go"><Ic n="chev" s={18}/></span>
      </button>
      <button className="tile row solid" onClick={()=>go("office/"+office.id+"/stock")}>
        <div className="tile-ic"><Ic n="box" s={24}/></div>
        <div className="tile-body">
          <div className="tile-t">ดูรายการคงคลัง{n>0 && <span className="chip" style={{marginLeft:9,
            background:"rgba(255,255,255,.2)",color:"#fff",fontSize:12}}>{n} รายการ</span>}</div>
          <div className="tile-d">ตารางของคงเหลือ เรียงจากศีรษะลงถึงเท้า · ส่งออก PDF และ Excel</div>
        </div>
        <span className="tile-go"><Ic n="chev" s={18}/></span>
      </button>
    </div>
  </Shell>);
}

/* ═══════════════ หน้า 6 — เพิ่มรายการเข้าคลัง ═══════════════ */
function VariantFields({item,val,onChange,subTypes,sizes}){
  if(!item || item.variant==="none") return null;
  const isColor=item.variant==="color";
  return (<>
    {!isColor && <div className="field">
      <label className="lbl">ประเภทย่อย <span className="req">*</span></label>
      <ComboBox key={item.id+"-sub"} value={val.subType} onChange={v=>onChange({...val,subType:v})}
        options={subTypes} placeholder={"เช่น "+(SEED_SUBTYPES[item.variant]||[""])[0]}
        addLabel="พิมพ์ประเภทย่อยใหม่…"/>
    </div>}
    <div className="field">
      <label className="lbl">{VARIANT_LABEL[item.variant]} <span className="req">*</span></label>
      {isColor
        ? <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {HELMET_COLORS.map(c=>(
              <button key={c.v} type="button" className={"chip clk"+(val.size===c.v?"":" n")}
                onClick={()=>onChange({...val,size:c.v})}
                style={val.size===c.v?{borderColor:"var(--plum-700)",background:"var(--plum-100)"}:null}>
                <span className="dotc" style={{background:c.hex}}></span>{c.v}
              </button>))}
          </div>
        : <ComboBox key={item.id+"-size"} value={val.size} onChange={v=>onChange({...val,size:v})}
            options={sizes} placeholder={"พิมพ์"+VARIANT_LABEL[item.variant]+"ใหม่"}
            addLabel={"พิมพ์"+VARIANT_LABEL[item.variant]+"ใหม่…"}/>}
    </div>
  </>);
}

function Page6StockIn({office,catalog,freq,user,stockIn}){
  const blank={ itemId:"", subType:"", size:"", qty:1, unit:"" };
  const [date,setDate]=useState(todayISO());
  const [row,setRow]  = useState(blank);
  const [pending,setPending]=useState([]);
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");
  const [busy,setBusy]=useState(false);
  const [mgr,setMgr]=useState(false);
  const [attach,setAttach]=useState([]);
  const [stage,setStage]=useState("");
  const [showAll,setShowAll]=useState(false);
  const [edit,setEdit]=useState(null);      // รายการที่กำลังแก้ไข
  const [editQty,setEditQty]=useState(1);
  const [editDate,setEditDate]=useState("");

  /* ปรับยอดคงคลังตามส่วนต่าง แล้วแก้ประวัติให้ตรงกัน */
  const applyDelta=async(r,delta)=>{
    if(delta===0) return true;
    const res=await R("offices/"+office.id+"/stock/"+r.sku+"/qty").transaction(q=>{
      const cur=(q===null?0:q)+delta;
      return cur<0 ? 0 : cur;
    });
    return res.committed;
  };

  const saveEdit=async()=>{
    const r=edit, nq=Math.max(1,parseInt(editQty)||1);
    const delta=nq-(r.qty||0);
    setErr("");
    try{
      await applyDelta(r,delta);
      await R("offices/"+office.id+"/stockIn/"+r.id).update({ qty:nq, date:editDate||r.date, editedAt:nowTs() });
      setEdit(null); setMsg("แก้ไขรายการแล้ว"); setTimeout(()=>setMsg(""),4000);
    }catch(e){ setErr("แก้ไขไม่สำเร็จ: "+e.message); }
  };

  const delEntry=async(r)=>{
    if(!confirm("ลบรายการนี้?\n\n"+r.itemName+"  "+(r.qty>0?"+":"")+r.qty+" "+r.unit+
                "\n\nยอดคงคลังจะถูกหักออกตามจำนวนนี้")) return;
    setErr("");
    try{
      await applyDelta(r, -(r.qty||0));
      await R("offices/"+office.id+"/stockIn/"+r.id).remove();
      setMsg("ลบรายการแล้ว"); setTimeout(()=>setMsg(""),4000);
    }catch(e){ setErr("ลบไม่สำเร็จ: "+e.message); }
  };

  /* จัดกลุ่มประวัติการเติมของเป็น "ครั้ง" ตาม batch */
  const batches = useMemo(()=>{
    const g={};
    Object.entries(stockIn||{}).forEach(([id,r])=>{
      const k=r.batch||("_"+id);
      if(!g[k]) g[k]={ key:k, ts:r.ts||0, date:r.date, by:r.by||"", files:r.files||[], kind:r.kind||"", rows:[] };
      g[k].rows.push({id,...r});
      if((r.ts||0)>g[k].ts) g[k].ts=r.ts||0;
    });
    return Object.values(g).sort((a,b)=>b.ts-a.ts);
  },[stockIn]);

  const items = useMemo(()=>{
    const arr=Object.entries(catalog||{}).map(([id,c])=>({id,...c}));
    return arr.sort((a,b)=>{
      const fa=(freq&&freq[a.id])||0, fb=(freq&&freq[b.id])||0;
      if(fa!==fb) return fb-fa;                               // ใช้บ่อยขึ้นก่อน
      const za=ZONE_IX[a.zone]??9, zb=ZONE_IX[b.zone]??9;
      if(za!==zb) return za-zb;
      return (a.order||0)-(b.order||0);
    });
  },[catalog,freq]);

  const item = items.find(i=>i.id===row.itemId);
  const subTypes = useMemo(()=>{
    if(!item) return [];
    const seeded=SEED_SUBTYPES[item.variant]||[];
    const saved=Object.values(item.subTypes||{});
    return Array.from(new Set([...seeded,...saved]));
  },[item]);

  const sizeOpts = useMemo(()=>{
    if(!item) return [];
    return Array.from(new Set([...sizeOptions(item.variant), ...Object.values(item.sizes||{})]));
  },[item]);

  const unitOptions = useMemo(()=>{
    const used=Object.entries((freq&&freq.__units)||{}).sort((a,b)=>b[1]-a[1]).map(a=>a[0]);
    const head=item&&item.unit?[item.unit]:[];
    return Array.from(new Set([...head,...used,...UNITS]));
  },[item,freq]);

  const pickItem=(o)=>{
    const it=items.find(i=>i.id===o.key);
    setRow({ itemId:o.key, subType:"", size:"", qty:1, unit:(it&&it.unit)||"" });
    setErr("");
  };

  const addRow=()=>{
    setErr("");
    if(!item){ setErr("เลือกชื่อรายการก่อน"); return; }
    if(item.variant!=="none"){
      if(item.variant!=="color" && !row.subType.trim()){ setErr("เลือกหรือพิมพ์ประเภทย่อย"); return; }
      if(!row.size){ setErr("เลือก"+VARIANT_LABEL[item.variant]); return; }
    }
    if(!row.unit.trim()){ setErr("เลือกหรือพิมพ์หน่วย"); return; }
    if(!(row.qty>0)){ setErr("จำนวนต้องมากกว่า 0"); return; }
    const e={ date, itemId:item.id, itemName:item.name, zone:item.zone, variant:item.variant,
              subType:row.subType.trim(), size:row.size, qty:row.qty, unit:row.unit.trim() };
    e.sku=skuOf(e);
    setPending(p=>{
      const ix=p.findIndex(x=>x.sku===e.sku && x.date===e.date && x.unit===e.unit);
      if(ix>=0){ const c=[...p]; c[ix]={...c[ix],qty:c[ix].qty+e.qty}; return c; }
      return [...p,e];
    });
    setRow({...blank, unit:row.unit});
  };

  const commit=async()=>{
    if(!pending.length) return;
    setBusy(true); setErr("");
    try{
      let uploaded=[];
      if(attach.length){
        for(let i=0;i<attach.length;i++){
          setStage("อัปโหลดเอกสาร "+(i+1)+"/"+attach.length+"…");
          uploaded.push(await driveUpload(attach[i], "รับเข้าคลัง/"+office.name+"/"+monthFolder(date), date));
        }
      }
      setStage("กำลังบันทึก…");
      const batch="B"+Date.now().toString(36);
      const upd={}; const stockRef=R("offices/"+office.id+"/stock");
      // อ่านของเดิมแล้วบวกเพิ่ม
      const snap=await stockRef.once("value"); const cur=snap.val()||{};
      const freqAdd={};
      pending.forEach(e=>{
        const old=cur[e.sku];
        const q=((old&&old.qty)||0)+e.qty;
        upd["offices/"+office.id+"/stock/"+e.sku]={
          itemId:e.itemId, itemName:e.itemName, zone:e.zone, variant:e.variant,
          subType:e.subType, size:e.size, unit:e.unit, qty:q, updatedAt:nowTs()
        };
        cur[e.sku]={qty:q};
        const lk=R("offices/"+office.id+"/stockIn").push().key;
        upd["offices/"+office.id+"/stockIn/"+lk]={
          date:e.date, sku:e.sku, itemId:e.itemId, itemName:e.itemName,
          subType:e.subType, size:e.size, unit:e.unit, qty:e.qty,
          ts:nowTs(), by:(user&&user.email)||"", batch, files:uploaded
        };
        freqAdd[e.itemId]=(freqAdd[e.itemId]||0)+1;
        freqAdd["__units/"+safeKey(e.unit)]=(freqAdd["__units/"+safeKey(e.unit)]||0)+1;
        if(e.subType) upd["catalog/"+e.itemId+"/subTypes/"+safeKey(e.subType)]=e.subType;
        if(e.size && e.variant!=="color" && sizeOptions(e.variant).indexOf(e.size)<0)
          upd["catalog/"+e.itemId+"/sizes/"+safeKey(e.size)]=e.size;
      });
      Object.entries(freqAdd).forEach(([k,v])=>{
        const path = k.indexOf("__units/")===0 ? k : k;
        upd["offices/"+office.id+"/freq/"+path]=((freq&&getFreq(freq,path))||0)+v;
      });
      await R("").update(upd);
      setMsg("เพิ่มเข้าคลังแล้ว "+pending.length+" รายการ"+(uploaded.length?" · แนบเอกสาร "+uploaded.length+" ไฟล์":""));
      setPending([]); setAttach([]); setTimeout(()=>setMsg(""),4500);
    }catch(e){ setErr("บันทึกไม่สำเร็จ: "+e.message); }
    setStage(""); setBusy(false);
  };

  const opts = items.map(i=>({ key:i.id, label:i.name, search:i.name,
    hint:(ZONES.find(z=>z.id===i.zone)||{}).name+(i.variant!=="none"?" · มีตัวเลือกย่อย":"") }));

  return (<Shell title="เพิ่มรายการเข้าคลัง" sub={office.name}
    right={<button className="btn onplum sm" onClick={()=>go("office/"+office.id+"/items")}><Ic n="back" s={15}/> ย้อนกลับ</button>}
    crumbs={[{t:"หน้าหลัก",to:""},{t:office.name,to:"office/"+office.id},
             {t:"จัดการรายการอุปกรณ์ฯ",to:"office/"+office.id+"/items"},{t:"เพิ่มรายการเข้าคลัง"}]}>

    {msg && <Msg kind="s">{msg}</Msg>}
    {err && <Msg kind="e">{err}</Msg>}

    <div className="card card-p" style={{marginBottom:16}}>
      <div style={{display:"grid",gridTemplateColumns:"150px 1fr",gap:14,alignItems:"start"}} className="rowform">
        <div className="field" style={{margin:0}}>
          <label className="lbl">วันที่</label>
          <input className="inp mono" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
        </div>
        <div className="field" style={{margin:0}}>
          <label className="lbl">ชื่อรายการ <span className="req">*</span></label>
          <Typeahead options={opts} value={item?item.name:""} onPick={pickItem}
            placeholder="พิมพ์ค้นหา เช่น ถุงมือ หมวก รองเท้า…"
            emptyText="ไม่พบรายการ — กด “เพิ่ม/ลบชนิดอุปกรณ์” เพื่อสร้างใหม่"
            render={o=>(<div><div style={{fontWeight:600}}>{o.label}</div><small>{o.hint}</small></div>)}/>
        </div>
      </div>

      {item && <>
        <div className="hr"></div>
        <div className="grid3">
          <div style={{gridColumn:item.variant==="none"?"span 1":"span 2"}}>
            <VariantFields item={item} val={row} onChange={setRow} subTypes={subTypes} sizes={sizeOpts}/>
            {item.variant==="none" && <div className="hint">รายการนี้ไม่มีตัวเลือกย่อย</div>}
          </div>
          <div>
            <div className="field"><label className="lbl">จำนวน <span className="req">*</span></label>
              <QtyPicker value={row.qty} onChange={q=>setRow({...row,qty:q})}/></div>
            <div className="field"><label className="lbl">หน่วย <span className="req">*</span></label>
              <ComboBox value={row.unit} onChange={u=>setRow({...row,unit:u})}
                options={unitOptions} placeholder="พิมพ์หน่วยใหม่" addLabel="พิมพ์หน่วยใหม่…"/></div>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:4}}>
          <button className="btn" onClick={addRow}><Ic n="plus" s={16}/> เพิ่มรายการนี้</button>
        </div>
      </>}

      <div className="hr"></div>
      <button className="btn neutral sm" onClick={()=>setMgr(true)}>
        <Ic n="wrench" s={13}/> เพิ่ม/ลบชนิดอุปกรณ์ในฐานข้อมูล</button>
    </div>

    <div className="sec-head"><h2>รายการที่รอยืนยัน</h2>
      <span className="chip n">{pending.length} รายการ</span></div>
    <div className="tblwrap">
      {pending.length===0
        ? <Empty icon="box" title="ยังไม่มีรายการรอยืนยัน" desc="กรอกด้านบนแล้วกด “เพิ่มรายการนี้”"/>
        : <table className="t"><thead><tr>
            <th style={{width:100}}>วันที่</th><th>รายการ</th>
            <th style={{width:90}} className="num">จำนวน</th><th style={{width:80}}>หน่วย</th><th style={{width:44}}></th>
          </tr></thead><tbody>
          {pending.map((e,i)=>(<tr key={i}>
            <td className="mono" style={{fontSize:12.5}}>{thDate(e.date)}</td>
            <td><div style={{fontWeight:600}}>{e.itemName}</div>
              {(e.subType||e.size) && <div className="hint">
                {e.subType}{e.subType&&e.size?" · ":""}
                {e.size&&(e.variant==="color"?e.size:"ไซส์ "+e.size)}</div>}</td>
            <td className="num mono" style={{fontWeight:700}}>{e.qty}</td>
            <td style={{fontSize:12.5}}>{e.unit}</td>
            <td><button className="iconbtn danger" onClick={()=>setPending(p=>p.filter((_,ix)=>ix!==i))}>
              <Ic n="trash" s={13}/></button></td>
          </tr>))}
        </tbody></table>}
    </div>

    <div className="card card-p" style={{marginTop:16}}>
      <div className="lbl" style={{marginBottom:9}}>เอกสารหลักฐานการสั่งซื้อ / รับของ</div>
      <AttachBox files={attach} onChange={setAttach}/>
    </div>

    <div style={{marginTop:16,display:"flex",justifyContent:"flex-end",gap:9,alignItems:"center"}}>
      {pending.length>0 && <button className="btn neutral" onClick={()=>setPending([])}>ล้างทั้งหมด</button>}
      <button className="btn ok" disabled={!pending.length||busy} onClick={commit}>
        {busy&&<span className="spin" style={{borderColor:"rgba(255,255,255,.4)",borderTopColor:"#fff"}}></span>}
        <Ic n="check" s={16}/> {busy&&stage?stage:"ยืนยันเพิ่มรายการ"}</button>
    </div>

    {/* ── ประวัติการเติมของเข้าคลัง ── */}
    <div className="sec-head" style={{marginTop:30}}>
      <h2>ประวัติการเติมของเข้าคลัง</h2>
      <div className="tb-spacer"></div>
      {batches.length>0 && <span className="chip n">{batches.length} ครั้ง</span>}
    </div>
    <div className="tblwrap">
      {batches.length===0
        ? <Empty icon="clock" title="ยังไม่มีประวัติการเติมของ"/>
        : <table className="t"><thead><tr>
            <th style={{width:104}}>วันที่</th><th>รายการ</th>
            <th style={{width:74}} className="num">รวม</th><th style={{width:180}}>เอกสารแนบ</th>
          </tr></thead><tbody>
          {(showAll?batches:batches.slice(0,15)).map(b=>(<tr key={b.key}>
            <td className="mono" style={{fontSize:12.5,verticalAlign:"top",paddingTop:12}}>{thDate(b.date)}</td>
            <td>{b.rows.map(r=>(<div key={r.id} style={{display:"flex",gap:8,alignItems:"center",padding:"3px 0"}}>
              <span style={{flex:1,minWidth:0}}>{r.itemName}
                {(r.subType||r.size) && <span className="hint"> · {r.subType}
                  {r.subType&&r.size?" · ":""}{r.size||""}</span>}</span>
              <span className="mono" style={{whiteSpace:"nowrap",color:r.qty<0?"var(--bad)":"var(--ink-2)"}}>
                {r.qty>0?"+":""}{r.qty} {r.unit}</span>
              <button className="iconbtn" title="แก้ไขจำนวน"
                onClick={()=>{ setEdit(r); setEditQty(Math.abs(r.qty)||1); setEditDate(r.date||todayISO()); }}>
                <Ic n="pen" s={12}/></button>
              <button className="iconbtn danger" title="ลบรายการนี้"
                onClick={()=>delEntry(r)}><Ic n="trash" s={12}/></button>
            </div>))}
            {b.kind==="adjust" && <span className="chip w" style={{marginTop:4}}>ปรับปรุงยอด</span>}</td>
            <td className="num mono" style={{fontWeight:500,verticalAlign:"top",paddingTop:12}}>
              {b.rows.reduce((s,r)=>s+(r.qty||0),0)}</td>
            <td style={{verticalAlign:"top",paddingTop:10}}><FileChips files={b.files}/></td>
          </tr>))}
        </tbody></table>}
    </div>
    {batches.length>15 && <div style={{marginTop:10,textAlign:"center"}}>
      <button className="btn neutral sm" onClick={()=>setShowAll(!showAll)}>
        {showAll?"ย่อรายการ":"ดูทั้งหมด ("+batches.length+" ครั้ง)"}</button></div>}

    {edit && <Modal title="แก้ไขรายการที่เติมเข้าคลัง" sub={fullLabel(edit)} onClose={()=>setEdit(null)}
      footer={<><button className="btn neutral" onClick={()=>setEdit(null)}>ยกเลิก</button>
              <button className="btn" onClick={saveEdit}>บันทึก</button></>}>
      <div className="grid2">
        <div className="field"><label className="lbl">วันที่</label>
          <input className="inp mono" type="date" value={editDate} onChange={e=>setEditDate(e.target.value)}/></div>
        <div className="field"><label className="lbl">จำนวน ({edit.unit})</label>
          <QtyPicker value={editQty} onChange={setEditQty}/></div>
      </div>
      <div className="msg i">
        <div>เดิม <b>{edit.qty} {edit.unit}</b> — ถ้าแก้เป็น <b>{editQty} {edit.unit}</b> ยอดคงคลังจะ
        {editQty-edit.qty===0 ? " ไม่เปลี่ยน"
          : (editQty-edit.qty>0 ? " เพิ่มขึ้น "+(editQty-edit.qty) : " ลดลง "+(edit.qty-editQty))+" "+edit.unit}</div>
      </div>
    </Modal>}

    {mgr && <ItemManager catalog={catalog} onClose={()=>setMgr(false)}/>}
  </Shell>);
}
function getFreq(freq,path){
  if(path.indexOf("__units/")===0) return ((freq.__units)||{})[path.slice(8)]||0;
  return freq[path]||0;
}

/* ── เพิ่ม/ลบชนิดอุปกรณ์ (ฐานข้อมูลกลาง ใช้ร่วมกันทั้ง 10 หน่วยงาน) ── */
function ItemManager({catalog,onClose}){
  const [nm,setNm]=useState(""); const [zone,setZone]=useState("area");
  const [variant,setVariant]=useState("none"); const [unit,setUnit]=useState("อัน");
  const [err,setErr]=useState(""); const [ok,setOk]=useState(""); const [busy,setBusy]=useState(false);
  const list=useMemo(()=>Object.entries(catalog||{}).map(([id,c])=>({id,...c}))
    .sort((a,b)=>((ZONE_IX[a.zone]??9)-(ZONE_IX[b.zone]??9))||((a.order||0)-(b.order||0))),[catalog]);

  const add=async()=>{
    setErr("");
    if(!nm.trim()){ setErr("กรอกชื่อรายการ"); return; }
    if(list.some(i=>i.name===nm.trim())){ setErr("มีรายการชื่อนี้อยู่แล้ว"); return; }
    const maxo=Math.max(0,...list.filter(i=>i.zone===zone).map(i=>i.order||0));
    setBusy(true);
    try{
      await R("catalog").push({ name:nm.trim(), zone, variant, unit:unit.trim()||"อัน", order:maxo+1 });
      setNm(""); setOk("เพิ่ม “"+nm.trim()+"” แล้ว"); setTimeout(()=>setOk(""),3500);
    }catch(e){ setErr(dbErr(e,"เพิ่มชนิดอุปกรณ์")); }
    setBusy(false);
  };
  const del=async(i)=>{
    if(!confirm("ลบ “"+i.name+"” ออกจากฐานข้อมูลชนิดอุปกรณ์?\n\nของที่อยู่ในคลังและประวัติการเบิกจ่ายเดิมจะยังคงอยู่")) return;
    try{ await R("catalog/"+i.id).remove(); setErr(""); }
    catch(e){ setErr(dbErr(e,"ลบชนิดอุปกรณ์")); }
  };

  return (<Modal wide title="เพิ่ม/ลบชนิดอุปกรณ์" sub="ใช้ร่วมกันทั้ง 10 หน่วยงาน" onClose={onClose}
    footer={<button className="btn" onClick={onClose}>เสร็จสิ้น</button>}>
    {err && <Msg kind="e">{err}</Msg>}
    {ok && <Msg kind="s">{ok}</Msg>}
    <div className="grid4" style={{marginBottom:6}}>
      <div className="field" style={{gridColumn:"span 2"}}><label className="lbl">ชื่อรายการ</label>
        <input className="inp" value={nm} onChange={e=>setNm(e.target.value)} placeholder="เช่น ชุดกันฝน"/></div>
      <div className="field"><label className="lbl">โซนการสวมใส่</label>
        <select className="inp" value={zone} onChange={e=>setZone(e.target.value)}>
          {ZONES.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}</select></div>
      <div className="field"><label className="lbl">หน่วยเริ่มต้น</label>
        <ComboBox value={unit} onChange={setUnit} options={UNITS}/></div>
    </div>
    <div className="field"><label className="lbl">ตัวเลือกย่อย</label>
      <select className="inp" value={variant} onChange={e=>setVariant(e.target.value)}>
        {VARIANT_KINDS.map(v=><option key={v.v} value={v.v}>{v.t}</option>)}</select></div>
    <button className="btn block" onClick={add} disabled={busy}>
      {busy?<span className="spin" style={{borderColor:"rgba(255,255,255,.4)",borderTopColor:"#fff"}}></span>
           :<Ic n="plus" s={15}/>} เพิ่มชนิดอุปกรณ์</button>

    <div className="hr"></div>
    <div className="tblwrap" style={{maxHeight:280,overflowY:"auto"}}>
      <table className="t"><thead><tr><th>ชื่อรายการ</th><th style={{width:120}}>โซน</th>
        <th style={{width:130}}>ตัวเลือกย่อย</th><th style={{width:60}}>หน่วย</th><th style={{width:40}}></th></tr></thead>
        <tbody>{list.map(i=>(<tr key={i.id}>
          <td style={{fontWeight:600}}>{i.name}</td>
          <td style={{fontSize:12.5,color:"var(--ink-2)"}}>{(ZONES.find(z=>z.id===i.zone)||{}).name||"-"}</td>
          <td style={{fontSize:12.5,color:"var(--ink-2)"}}>
            {i.variant==="none"?"—":(i.variant==="color"?"เลือกสี":"ประเภทย่อย + ไซส์")}</td>
          <td style={{fontSize:12.5}}>{i.unit}</td>
          <td><button className="iconbtn danger" onClick={()=>del(i)}><Ic n="trash" s={12}/></button></td>
        </tr>))}</tbody></table>
    </div>
  </Modal>);
}

/* ═══════════════ หน้า 7 — ดูรายการคงคลัง ═══════════════ */
function Page7Stock({office,stock,stockIn}){
  const [q,setQ]=useState("");
  const [busy,setBusy]=useState(false);
  const [issued,setIssued]=useState({});
  const [adj,setAdj]=useState(null);
  const [adjQty,setAdjQty]=useState(0);
  const [hideZero,setHideZero]=useState(false);

  const delRow=async(r)=>{
    const warn = (r.qty||0)>0
      ? "\n\n⚠️ รายการนี้ยังมีของคงเหลือ "+r.qty+" "+r.unit+" การลบจะทำให้ยอดนี้หายไปจากคลัง"
      : "";
    if(!confirm("ลบ “"+fullLabel(r)+"” ออกจากรายการคงคลัง?"+warn+
                "\n\nประวัติการรับเข้าและการเบิกจ่ายเดิมจะยังคงอยู่")) return;
    try{ await R("offices/"+office.id+"/stock/"+r.sku).remove(); }
    catch(e){ alert(dbErr(e,"ลบรายการ")); }
  };
  const stageRef=useRef(null);

  useEffect(()=>{
    let live=true;
    R("withdrawals").orderByChild("officeId").equalTo(office.id).once("value").then(s=>{
      if(!live) return;
      const m={}; const v=s.val()||{};
      Object.values(v).forEach(w=>(w.items||[]).forEach(it=>{ m[it.sku]=(m[it.sku]||0)+(it.qty||0); }));
      setIssued(m);
    }).catch(()=>{});
    return ()=>{ live=false; };
  },[office.id,stock]);

  const received = useMemo(()=>{
    const m={}; Object.values(stockIn||{}).forEach(r=>{ m[r.sku]=(m[r.sku]||0)+(r.qty||0); }); return m;
  },[stockIn]);

  const rows = useMemo(()=>{
    const s=q.trim().toLowerCase();
    return Object.entries(stock||{}).map(([sku,v])=>({sku,...v}))
      .filter(r=>(!s || fullLabel(r).toLowerCase().indexOf(s)>=0) && (!hideZero || (r.qty||0)>0))
      .sort((a,b)=>{
        const za=ZONE_IX[a.zone]??9, zb=ZONE_IX[b.zone]??9; if(za!==zb) return za-zb;
        if(a.itemName!==b.itemName) return a.itemName.localeCompare(b.itemName,"th");
        if((a.subType||"")!==(b.subType||"")) return (a.subType||"").localeCompare(b.subType||"","th");
        const na=parseInt(a.size), nb=parseInt(b.size);
        if(!isNaN(na)&&!isNaN(nb)) return na-nb;
        return String(a.size||"").localeCompare(String(b.size||""),"th");
      });
  },[stock,q,hideZero]);

  const byZone = useMemo(()=>ZONES.map(z=>({z,rows:rows.filter(r=>r.zone===z.id)})).filter(g=>g.rows.length),[rows]);
  const totalQty = rows.reduce((s,r)=>s+(r.qty||0),0);

  const doExcel=()=>{
    const out=[];
    byZone.forEach(g=>g.rows.forEach((r,i)=>out.push({
      "โซน":g.z.name, "ชื่อรายการ":r.itemName, "ประเภทย่อย":r.subType||"-",
      "ไซส์/สี":r.size||"-", "คงเหลือ":r.qty||0, "หน่วย":r.unit||"",
      "รับเข้าสะสม":received[r.sku]||0, "จ่ายออกสะสม":issued[r.sku]||0
    })));
    exportXLSX(out,"คงคลัง","รายการคงคลัง-"+office.name+"-"+todayISO()+".xlsx",[22,30,22,10,10,8,12,12]);
  };
  const doPDF=async()=>{
    setBusy(true);
    try{ await exportPDF(stageRef.current,"รายการคงคลัง-"+office.name+"-"+todayISO()+".pdf","p"); }
    catch(e){ alert("สร้าง PDF ไม่สำเร็จ: "+e.message); }
    setBusy(false);
  };
  const saveAdj=async()=>{
    const r=adj; const nq=Math.max(0,parseInt(adjQty)||0); const d=nq-(r.qty||0);
    await R("offices/"+office.id+"/stock/"+r.sku).update({qty:nq,updatedAt:nowTs()});
    if(d!==0) await R("offices/"+office.id+"/stockIn").push({
      date:todayISO(), sku:r.sku, itemId:r.itemId, itemName:r.itemName, subType:r.subType||"",
      size:r.size||"", unit:r.unit||"", qty:d, ts:nowTs(), kind:"adjust" });
    setAdj(null);
  };

  return (<Shell title="ดูรายการคงคลัง" sub={office.name}
    right={<button className="btn onplum sm" onClick={()=>go("office/"+office.id+"/items")}><Ic n="back" s={15}/> ย้อนกลับ</button>}
    crumbs={[{t:"หน้าหลัก",to:""},{t:office.name,to:"office/"+office.id},
             {t:"จัดการรายการอุปกรณ์ฯ",to:"office/"+office.id+"/items"},{t:"ดูรายการคงคลัง"}]}>

    <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:14}}>
      <input className="inp" style={{maxWidth:300}} placeholder="ค้นหารายการ…" value={q} onChange={e=>setQ(e.target.value)}/>
      <label className="checkbox">
        <input type="checkbox" checked={hideZero} onChange={e=>setHideZero(e.target.checked)}/>
        ซ่อนรายการที่หมดคลัง</label>
      <div className="tb-spacer"></div>
      <button className="btn ghost sm" onClick={doExcel} disabled={!rows.length}><Ic n="file" s={14}/> ส่งออก Excel</button>
      <button className="btn ghost sm" onClick={doPDF} disabled={!rows.length||busy}>
        {busy?<span className="spin"></span>:<Ic n="pdf" s={14}/>} ส่งออก PDF</button>
    </div>

    {rows.length===0
      ? <div className="tblwrap"><Empty icon="box" title="ยังไม่มีของในคลัง"
          desc="ไปที่ “เพิ่มรายการเข้าคลัง” เพื่อบันทึกของที่รับเข้ามา"
          action={<button className="btn" onClick={()=>go("office/"+office.id+"/stock-in")}>
            <Ic n="plus" s={15}/> เพิ่มรายการเข้าคลัง</button>}/></div>
      : <>
        <div className="hint" style={{marginBottom:10}}>
          {rows.length} รายการ · คงเหลือรวม <b className="mono">{totalQty}</b> ชิ้น ·
          เรียงตามลำดับการสวมใส่จากศีรษะลงถึงเท้า</div>
        {byZone.map(g=>(<div className="zone" key={g.z.id}>
          <div className="zone-head">
            <div className="zone-dot"><Ic n={g.z.icon} s={17}/></div>
            <div className="zone-name">{g.z.name}</div>
            <div className="zone-rule"></div>
            <div className="zone-count">{g.rows.length} รายการ</div>
          </div>
          <div className="tblwrap"><table className="t"><thead><tr>
            <th>ชื่อรายการ</th><th style={{width:170}}>ประเภทย่อย</th><th style={{width:90}}>ไซส์/สี</th>
            <th style={{width:92}} className="num">คงเหลือ</th><th style={{width:64}}>หน่วย</th>
            <th style={{width:82}} className="num">รับเข้า</th><th style={{width:82}} className="num">จ่ายออก</th>
            <th style={{width:118}}></th>
          </tr></thead><tbody>
            {g.rows.map(r=>{
              const low=(r.qty||0)<=0?"r":((r.qty||0)<=3?"w":null);
              return (<tr key={r.sku}>
                <td style={{fontWeight:600}}>{r.itemName}</td>
                <td style={{fontSize:13,color:"var(--ink-2)"}}>{r.subType||"—"}</td>
                <td>{r.variant==="color"
                  ? <span style={{display:"inline-flex",alignItems:"center",gap:5}}>
                      <span className="dotc" style={{background:colorHex(r.size)}}></span>{r.size}</span>
                  : <span className="mono">{r.size||"—"}</span>}</td>
                <td className="num"><span className={"chip "+(low||"g")} style={{fontWeight:700}}>{r.qty||0}</span></td>
                <td style={{fontSize:13}}>{r.unit}</td>
                <td className="num mono" style={{color:"var(--ink-3)",fontSize:12.5}}>{received[r.sku]||0}</td>
                <td className="num mono" style={{color:"var(--ink-3)",fontSize:12.5}}>{issued[r.sku]||0}</td>
                <td><div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                  <button className="btn ghost xs" title="แก้ไขยอดคงเหลือ"
                    onClick={()=>{setAdj(r);setAdjQty(r.qty||0);}}><Ic n="pen" s={12}/> แก้ไข</button>
                  <button className="iconbtn danger" title="ลบรายการนี้ออกจากคลัง"
                    onClick={()=>delRow(r)}><Ic n="trash" s={12}/></button>
                </div></td>
              </tr>);
            })}
          </tbody></table></div>
        </div>))}
      </>}

    {adj && <Modal title="ปรับปรุงยอดคงเหลือ" sub={fullLabel(adj)} onClose={()=>setAdj(null)}
      footer={<><button className="btn neutral" onClick={()=>setAdj(null)}>ยกเลิก</button>
              <button className="btn" onClick={saveAdj}>บันทึก</button></>}>
      <div className="field"><label className="lbl">จำนวนคงเหลือที่ถูกต้อง ({adj.unit})</label>
        <input className="inp mono" type="number" min="0" value={adjQty} autoFocus
          onChange={e=>setAdjQty(e.target.value)}/></div>
      <div className="hint">เดิม {adj.qty||0} {adj.unit}</div>
    </Modal>}

    {/* เวทีสำหรับสร้าง PDF */}
    <div className="pdfstage" ref={stageRef} aria-hidden="true">
      <div style={{borderBottom:"3px solid #D2A017",paddingBottom:12,marginBottom:16}}>
        <div style={{fontSize:13,color:"#5B2178",fontWeight:700,letterSpacing:".08em"}}>การไฟฟ้าส่วนภูมิภาค</div>
        <div style={{fontSize:24,fontWeight:800}}>รายการอุปกรณ์ความปลอดภัยฯ คงคลัง</div>
        <div style={{fontSize:15,marginTop:2}}>{office.name} · ข้อมูล ณ วันที่ {thDate(todayISO())}</div>
      </div>
      {byZone.map(g=>(<div key={g.z.id} style={{marginBottom:14}}>
        <div style={{fontWeight:800,fontSize:15,background:"#F3ECF8",color:"#3A1147",
          padding:"5px 10px",borderRadius:6,marginBottom:6}}>{g.z.name}</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#FAF8FC"}}>
            {["ลำดับ","ชื่อรายการ","ประเภทย่อย","ไซส์/สี","คงเหลือ","หน่วย","รับเข้า","จ่ายออก"].map((h,i)=>
              <th key={i} style={{border:"1px solid #E5E1EB",padding:"5px 7px",
                textAlign:i>=4?"center":"left",fontWeight:700}}>{h}</th>)}
          </tr></thead>
          <tbody>{g.rows.map((r,i)=>(<tr key={r.sku}>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center"}}>{i+1}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px"}}>{r.itemName}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px"}}>{r.subType||"—"}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center"}}>{r.size||"—"}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center",fontWeight:700}}>{r.qty||0}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center"}}>{r.unit}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center"}}>{received[r.sku]||0}</td>
            <td style={{border:"1px solid #E5E1EB",padding:"4px 7px",textAlign:"center"}}>{issued[r.sku]||0}</td>
          </tr>))}</tbody>
        </table>
      </div>))}
      <div style={{marginTop:18,fontSize:12,color:"#8A8296",borderTop:"1px solid #E5E1EB",paddingTop:8}}>
        รวม {rows.length} รายการ · คงเหลือรวม {totalQty} ชิ้น ·
        ออกจากระบบจัดการอุปกรณ์ความปลอดภัยฯ กฟจ.ลำพูน และ กฟส.ในสังกัด
      </div>
    </div>
  </Shell>);
}

/* ═══════════════ หน้า 8 — Dashboard ประวัติการเบิกจ่าย (สาธารณะ) ═══════════════ */
function Page8Dashboard({user,isMaster}){
  const [raw,setRaw]=useState(null);
  const [f,setF]=useState({office:"",item:"",from:"",to:"",empId:"",name:""});
  const [applied,setApplied]=useState({office:"",item:"",from:"",to:"",empId:"",name:""});
  const [person,setPerson]=useState(null);
  const [busy,setBusy]=useState(false);
  const stageRef=useRef(null);

  useEffect(()=>{
    const ref=R("withdrawals").orderByChild("ts").limitToLast(4000);
    const cb=ref.on("value",s=>{
      const v=s.val()||{};
      setRaw(Object.entries(v).map(([id,w])=>({id,...w})).sort((a,b)=>b.ts-a.ts));
    },()=>setRaw([]));
    return ()=>ref.off("value",cb);
  },[]);

  const itemNames = useMemo(()=>{
    const set=new Set(); (raw||[]).forEach(w=>(w.items||[]).forEach(i=>set.add(i.itemName)));
    return Array.from(set).sort((a,b)=>a.localeCompare(b,"th"));
  },[raw]);

  /* แตกเป็นรายบรรทัด (1 บรรทัด = 1 รายการที่เบิก) */
  const lines = useMemo(()=>{
    const out=[];
    (raw||[]).forEach(w=>(w.items||[]).forEach((it,ix)=>out.push({
      key:w.id+"_"+ix, wid:w.id, ts:w.ts, date:w.date||isoOfTs(w.ts),
      officeId:w.officeId, office:OFC[w.officeId]||w.officeId,
      empId:w.empId||"", name:w.name||"", position:w.position||"", photo:w.photo||null,
      homeOfficeId:w.homeOfficeId||"", ...it
    })));
    return out;
  },[raw]);

  const filtered = useMemo(()=>{
    const a=applied;
    const nm=a.name.trim().toLowerCase(), eid=a.empId.trim().toLowerCase();
    return lines.filter(l=>{
      if(a.office && l.officeId!==a.office) return false;
      if(a.item   && l.itemName!==a.item)   return false;
      if(a.from   && l.date<a.from)         return false;
      if(a.to     && l.date>a.to)           return false;
      if(eid      && l.empId.toLowerCase().indexOf(eid)<0) return false;
      if(nm       && l.name.toLowerCase().indexOf(nm)<0)   return false;
      return true;
    });
  },[lines,applied]);

  const stats = useMemo(()=>{
    const people=new Set(), offs=new Set(); let qty=0;
    filtered.forEach(l=>{ people.add(l.officeId+"|"+l.empId); offs.add(l.officeId); qty+=(l.qty||0); });
    return { rows:filtered.length, people:people.size, offices:offs.size, qty };
  },[filtered]);

  const personLines = useMemo(()=>{
    if(!person) return [];
    return lines.filter(l=>l.officeId===person.officeId && l.empId===person.empId);
  },[lines,person]);

  /* ลบใบเบิกทั้งใบ แล้วคืนของกลับเข้าคลัง — เฉพาะแอดมินหลัก */
  const delW=async(l)=>{
    const w=(raw||[]).find(x=>x.id===l.wid);
    if(!w) return;
    const items=w.items||[];
    const txt=items.map(i=>"  • "+fullLabel(i)+"   "+i.qty+" "+i.unit).join("\n");
    if(!confirm("ลบใบเบิกนี้ทั้งใบ?\n\n"+(w.name||"-")+" · "+thDateTime(w.ts)+"\n"+txt+
      "\n\nยอดคงคลังของ "+(OFC[w.officeId]||w.officeId)+" จะถูกคืนกลับตามจำนวนข้างต้น\nการลบนี้ย้อนกลับไม่ได้")) return;
    try{
      for(const it of items){
        await R("offices/"+w.officeId+"/stock/"+it.sku+"/qty")
          .transaction(q=>{ if(q===null) return; return q+(it.qty||0); });
      }
      await R("withdrawals/"+w.id).remove();
    }catch(e){ alert(dbErr(e,"ลบใบเบิก")); }
  };

  const doExcel=()=>{
    exportXLSX(filtered.map((l,i)=>({
      "ลำดับ":i+1,"วันที่":thDate(l.date),"เวลา":thDateTime(l.ts).split(" ")[1],
      "หน่วยงาน":l.office,"รหัสประจำตัว":l.empId,"ชื่อ-นามสกุล":l.name,"ตำแหน่ง":l.position,
      "รายการ":l.itemName,"ประเภทย่อย":l.subType||"-","ไซส์/สี":l.size||"-",
      "จำนวน":l.qty,"หน่วย":l.unit
    })),"ประวัติการเบิกจ่าย","ประวัติการเบิกจ่าย-"+todayISO()+".xlsx",[6,12,7,18,14,26,16,28,20,10,8,8]);
  };
  const doPDF=async()=>{
    setBusy(true);
    try{ await exportPDF(stageRef.current,"ประวัติการเบิกจ่าย-"+todayISO()+".pdf","l"); }
    catch(e){ alert("สร้าง PDF ไม่สำเร็จ: "+e.message); }
    setBusy(false);
  };
  const clear=()=>{ const z={office:"",item:"",from:"",to:"",empId:"",name:""}; setF(z); setApplied(z); };

  if(raw===null) return <Loading t="กำลังโหลดประวัติการเบิกจ่าย…"/>;

  return (<Shell title="Dashboard ประวัติการเบิกจ่าย อุปกรณ์ความปลอดภัยฯ"
    sub="กฟจ.ลำพูน และ กฟส.ในสังกัด"
    right={<button className="btn onplum sm" onClick={()=>go("")}><Ic n="back" s={15}/> หน้าหลัก</button>}>

    <div className="card card-p" style={{marginTop:6,marginBottom:16}}>
      <div className="grid3">
        <div className="field" style={{margin:0}}><label className="lbl">การไฟฟ้า</label>
          <select className="inp" value={f.office} onChange={e=>setF({...f,office:e.target.value})}>
            <option value="">ทุกหน่วยงาน</option>
            {OFFICES.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}</select></div>
        <div className="field" style={{margin:0}}><label className="lbl">รายการ</label>
          <select className="inp" value={f.item} onChange={e=>setF({...f,item:e.target.value})}>
            <option value="">ทุกรายการ</option>
            {itemNames.map(n=><option key={n} value={n}>{n}</option>)}</select></div>
        <div className="field" style={{margin:0}}><label className="lbl">รหัสพนักงาน</label>
          <input className="inp mono" value={f.empId} placeholder="เช่น 512345"
            onChange={e=>setF({...f,empId:e.target.value})}/></div>
        <div className="field" style={{margin:0}}><label className="lbl">ค้นหารายชื่อ</label>
          <input className="inp" value={f.name} placeholder="พิมพ์ชื่อบางส่วนได้"
            onChange={e=>setF({...f,name:e.target.value})}/></div>
        <div className="field" style={{margin:0}}><label className="lbl">เบิกตั้งแต่วันที่</label>
          <input className="inp mono" type="date" value={f.from} onChange={e=>setF({...f,from:e.target.value})}/></div>
        <div className="field" style={{margin:0}}><label className="lbl">ถึงวันที่</label>
          <input className="inp mono" type="date" value={f.to} onChange={e=>setF({...f,to:e.target.value})}/></div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
        <button className="btn" onClick={()=>{setApplied({...f});setPerson(null);}}><Ic n="search" s={15}/> ค้นหา</button>
        <button className="btn neutral" onClick={clear}>ล้างตัวกรอง</button>
        {isMaster && <span className="chip w"><Ic n="key" s={11}/> โหมดแอดมินหลัก · ลบใบเบิกได้</span>}
        <div className="tb-spacer"></div>
        <button className="btn ghost sm" onClick={doExcel} disabled={!filtered.length}><Ic n="file" s={14}/> ส่งออก Excel</button>
        <button className="btn ghost sm" onClick={doPDF} disabled={!filtered.length||busy}>
          {busy?<span className="spin"></span>:<Ic n="pdf" s={14}/>} ส่งออก PDF</button>
      </div>
    </div>

    <div className="grid4" style={{marginBottom:16}}>
      {[["รายการที่เบิก",stats.rows],["จำนวนรวม",stats.qty],["ผู้เบิก (คน)",stats.people],["หน่วยงาน",stats.offices]]
        .map(([t,v],i)=>(<div className={"stat"+(i===1?" gold":"")} key={t}>
          <div className="stat-l">{t}</div><div className="stat-v">{v}</div></div>))}
    </div>

    <div className="tblwrap">
      {filtered.length===0
        ? <Empty icon="clock" title="ไม่พบประวัติการเบิกจ่าย" desc="ลองปรับตัวกรองหรือกดล้างตัวกรอง"/>
        : <table className="t"><thead><tr>
            <th style={{width:118}}>วันที่ / เวลา</th><th style={{width:130}}>หน่วยงาน</th>
            <th style={{width:96}}>รหัส</th><th style={{minWidth:170}}>ชื่อ-นามสกุล</th>
            <th>รายการ</th><th style={{width:74}} className="num">จำนวน</th><th style={{width:62}}>หน่วย</th>
            <th style={{width:86}}>หลักฐาน</th>
            {isMaster && <th style={{width:46}}></th>}
          </tr></thead><tbody>
          {filtered.slice(0,600).map(l=>(<tr key={l.key}>
            <td className="mono" style={{fontSize:12}}>{thDateTime(l.ts)}</td>
            <td style={{fontSize:13}}>{l.office}</td>
            <td className="mono" style={{fontSize:12.5}}>{l.empId}</td>
            <td>{l.homeOfficeId && l.homeOfficeId!==l.officeId &&
              <div><span className="chip w" style={{fontSize:11,marginBottom:3}}>
                ข้ามหน่วยงาน · {OFC[l.homeOfficeId]||l.homeOfficeId}</span></div>}
              <button className="namebtn"
              onClick={()=>setPerson({officeId:l.officeId,empId:l.empId,name:l.name,position:l.position,office:l.office})}>
              {l.name||"(ไม่ระบุ)"}</button></td>
            <td><div style={{fontWeight:600}}>{l.itemName}</div>
              {(l.subType||l.size) && <div className="hint">{l.subType}
                {l.subType&&l.size?" · ":""}{l.size&&(l.variant==="color"?l.size:"ไซส์ "+l.size)}</div>}</td>
            <td className="num mono" style={{fontWeight:700}}>{l.qty}</td>
            <td style={{fontSize:13}}>{l.unit}</td>
            <td>{l.photo&&safeUrl(l.photo.view)
              ? <a className="btn neutral xs" href={safeUrl(l.photo.view)} target="_blank" rel="noopener noreferrer"
                  style={{textDecoration:"none"}}><Ic n="eye" s={12}/> ดูรูป</a>
              : <span style={{color:"var(--ink-4)"}}>—</span>}</td>
            {isMaster && <td><button className="iconbtn danger" title="ลบใบเบิกนี้และคืนของเข้าคลัง"
              onClick={()=>delW(l)}><Ic n="trash" s={13}/></button></td>}
          </tr>))}
        </tbody></table>}
    </div>
    {filtered.length>600 && <div className="hint" style={{marginTop:8}}>
      แสดง 600 แถวแรกจาก {filtered.length} แถว</div>}

    {person && <Modal wide title={person.name} sub={person.office+" · รหัส "+person.empId+(person.position?" · "+person.position:"")}
      onClose={()=>setPerson(null)}
      footer={<><button className="btn neutral" onClick={()=>{
          exportXLSX(personLines.map((l,i)=>({"ลำดับ":i+1,"วันที่":thDate(l.date),"รายการ":l.itemName,
            "ประเภทย่อย":l.subType||"-","ไซส์/สี":l.size||"-","จำนวน":l.qty,"หน่วย":l.unit})),
            "ประวัติรายบุคคล","ประวัติการเบิก-"+person.empId+".xlsx",[6,12,28,20,10,8,8]);
        }}><Ic n="file" s={14}/> ส่งออก Excel</button>
        <button className="btn" onClick={()=>setPerson(null)}>ปิด</button></>}>
      <div className="hint" style={{marginBottom:10}}>เบิกทั้งหมด {personLines.length} รายการ ·
        รวม {personLines.reduce((s,l)=>s+(l.qty||0),0)} ชิ้น</div>
      <div className="tblwrap" style={{maxHeight:400,overflowY:"auto"}}>
        <table className="t"><thead><tr><th style={{width:104}}>วันที่</th><th>รายการ</th>
          <th style={{width:70}} className="num">จำนวน</th><th style={{width:58}}>หน่วย</th></tr></thead>
          <tbody>{personLines.map(l=>(<tr key={l.key}>
            <td className="mono" style={{fontSize:12.5}}>{thDate(l.date)}</td>
            <td><div style={{fontWeight:600}}>{l.itemName}</div>
              {(l.subType||l.size)&&<div className="hint">{l.subType}{l.subType&&l.size?" · ":""}
                {l.size&&(l.variant==="color"?l.size:"ไซส์ "+l.size)}</div>}</td>
            <td className="num mono" style={{fontWeight:700}}>{l.qty}</td>
            <td style={{fontSize:13}}>{l.unit}</td>
          </tr>))}</tbody></table>
      </div>
    </Modal>}

    {/* เวทีสำหรับสร้าง PDF */}
    <div className="pdfstage" ref={stageRef} aria-hidden="true">
      <div style={{borderBottom:"3px solid #D2A017",paddingBottom:12,marginBottom:14}}>
        <div style={{fontSize:13,color:"#5B2178",fontWeight:700,letterSpacing:".08em"}}>การไฟฟ้าส่วนภูมิภาค</div>
        <div style={{fontSize:23,fontWeight:800}}>ประวัติการเบิกจ่ายอุปกรณ์ความปลอดภัยฯ</div>
        <div style={{fontSize:14,marginTop:2}}>
          {applied.office?OFC[applied.office]:"กฟจ.ลำพูน และ กฟส.ในสังกัด"}
          {applied.item?" · รายการ: "+applied.item:""}
          {(applied.from||applied.to)?" · ช่วงวันที่ "+(applied.from?thDate(applied.from):"เริ่มต้น")+" – "+(applied.to?thDate(applied.to):"ปัจจุบัน"):""}
          {" · พิมพ์เมื่อ "+thDate(todayISO())}
        </div>
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead><tr style={{background:"#F3ECF8"}}>
          {["ลำดับ","วันที่","หน่วยงาน","รหัส","ชื่อ-นามสกุล","รายการ","ประเภทย่อย","ไซส์/สี","จำนวน","หน่วย"].map((h,i)=>
            <th key={i} style={{border:"1px solid #E5E1EB",padding:"5px 6px",textAlign:"left",fontWeight:700}}>{h}</th>)}
        </tr></thead>
        <tbody>{filtered.slice(0,900).map((l,i)=>(<tr key={l.key}>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px",textAlign:"center"}}>{i+1}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px",whiteSpace:"nowrap"}}>{thDate(l.date)}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px"}}>{l.office}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px"}}>{l.empId}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px"}}>{l.name}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px"}}>{l.itemName}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px"}}>{l.subType||"—"}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px",textAlign:"center"}}>{l.size||"—"}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px",textAlign:"center",fontWeight:700}}>{l.qty}</td>
          <td style={{border:"1px solid #E5E1EB",padding:"3px 6px",textAlign:"center"}}>{l.unit}</td>
        </tr>))}</tbody>
      </table>
      <div style={{marginTop:14,fontSize:11.5,color:"#8A8296",borderTop:"1px solid #E5E1EB",paddingTop:8}}>
        รวม {filtered.length} รายการ · จำนวนรวม {stats.qty} ชิ้น · ผู้เบิก {stats.people} คน
      </div>
    </div>
  </Shell>);
}

/* ═══════════════ หน้าสุดท้าย — หน้าเบิกของ (สแกน QR) ═══════════════ */
function Page9Withdraw({office}){
  const [ready,setReady]=useState(false);
  const [people,setPeople]=useState({});
  const [stock,setStock]  =useState({});
  const [who,setWho]      =useState(null);
  const [pickName,setPickName]=useState("");
  const [group,setGroup]  =useState(null);   // {itemName, variants:[...]}
  const [sel,setSel]      =useState(null);   // sku ที่เลือก
  const [qty,setQty]      =useState(1);
  const [cart,setCart]    =useState([]);
  const [err,setErr]      =useState("");
  const [busy,setBusy]    =useState(false);
  const [done,setDone]    =useState(null);
  const [photo,setPhoto]  =useState(null);
  const [preview,setPreview]=useState("");
  const [stage,setStage]  =useState("");
  const [allPeople,setAllPeople]=useState(null);
  const [reg,setReg]        =useState(null);
  const [regErr,setRegErr]  =useState("");
  const [regBusy,setRegBusy]=useState(false);   // รายชื่อหน่วยงานอื่น (ค้นหาข้ามหน่วยงานได้ทันที)

  useEffect(()=>{
    let offs=[];
    const start=async()=>{
      try{ if(!auth.currentUser) await auth.signInAnonymously(); }catch(e){}
      const p=R("offices/"+office.id+"/people"), s=R("offices/"+office.id+"/stock");
      const c1=p.on("value",x=>{ setPeople(x.val()||{}); setReady(true); },()=>setReady(true));
      const c2=s.on("value",x=>setStock(x.val()||{}),()=>{});
      offs=[()=>p.off("value",c1),()=>s.off("value",c2)];

      /* ดึงรายชื่อหน่วยงานอื่นไว้เบื้องหลัง เผื่อมีคนมาเบิกข้ามหน่วยงาน */
      const out={};
      await Promise.all(OFFICES.filter(o=>o.id!==office.id).map(async o=>{
        try{ const snap=await R("offices/"+o.id+"/people").once("value"); out[o.id]=snap.val()||{}; }
        catch(e){ out[o.id]={}; }
      }));
      setAllPeople(out);
    };
    start();
    return ()=>offs.forEach(f=>f());
  },[office.id]);

  const peopleOpts = useMemo(()=>{
    const mk=(oid,id,p)=>({
      key:oid+"|"+id, label:p.fullName,
      search:(p.empId||"")+" "+(p.fullName||"")+" "+stripPrefix(p.fullName||""),
      empId:p.empId, position:p.position, department:p.department,
      officeId:oid, officeName:OFC[oid], person:p
    });
    const own=Object.entries(people).map(([id,p])=>mk(office.id,id,p));
    if(!allPeople) return own;
    const rest=[];
    Object.entries(allPeople).forEach(([oid,m])=>
      Object.entries(m||{}).forEach(([id,p])=>rest.push(mk(oid,id,p))));
    return own.concat(rest);     /* หน่วยงานตนเองขึ้นก่อนเสมอ */
  },[people,allPeople,office.id]);

  /* รวมของในคลังเป็นกลุ่มตามชื่อรายการ (เฉพาะที่ยังมีของ) */
  const groups = useMemo(()=>{
    const g={};
    Object.entries(stock).forEach(([sku,v])=>{
      if(!(v.qty>0)) return;
      const inCart=cart.filter(c=>c.sku===sku).reduce((s,c)=>s+c.qty,0);
      const left=(v.qty||0)-inCart;
      if(left<=0) return;
      if(!g[v.itemName]) g[v.itemName]={itemName:v.itemName,zone:v.zone,variant:v.variant,variants:[],total:0};
      g[v.itemName].variants.push({sku,...v,left});
      g[v.itemName].total+=left;
    });
    return Object.values(g).sort((a,b)=>((ZONE_IX[a.zone]??9)-(ZONE_IX[b.zone]??9))||a.itemName.localeCompare(b.itemName,"th"));
  },[stock,cart]);

  const itemOpts = groups.map(g=>({ key:g.itemName, label:g.itemName, search:g.itemName,
    hint:(ZONES.find(z=>z.id===g.zone)||{}).name+" · คงเหลือ "+g.total }));

  const cur = group ? groups.find(g=>g.itemName===group.itemName) : null;
  const selRow = cur && sel ? cur.variants.find(v=>v.sku===sel) : null;

  const addCart=()=>{
    setErr("");
    if(!cur){ setErr("เลือกรายการที่จะเบิกก่อน"); return; }
    if(cur.variants.length>1 && !selRow){ setErr("เลือก"+(cur.variant==="color"?"สี":"ประเภทย่อย/ไซส์")+"ก่อน"); return; }
    const row = selRow || cur.variants[0];
    if(qty>row.left){ setErr("คงเหลือ "+row.left+" "+row.unit+" — เบิกได้ไม่เกินนี้"); return; }
    setCart(c=>{
      const ix=c.findIndex(x=>x.sku===row.sku);
      if(ix>=0){ const n=[...c]; n[ix]={...n[ix],qty:n[ix].qty+qty}; return n; }
      return [...c,{ sku:row.sku, itemId:row.itemId, itemName:row.itemName, variant:row.variant,
                     subType:row.subType||"", size:row.size||"", unit:row.unit, qty }];
    });
    setGroup(null); setSel(null); setQty(1); setPickName("");
  };

  const saveReg=async()=>{
    setRegErr("");
    const id=reg.empId.trim(), nm=reg.fullName.trim();
    if(!id){ setRegErr("กรอกรหัสประจำตัว"); return; }
    if(!nm){ setRegErr("กรอกชื่อ-นามสกุล"); return; }
    const dup=peopleOpts.find(o=>String(o.empId||"").trim()===id);
    if(dup){ setRegErr("รหัส "+id+" มีอยู่แล้ว — "+dup.label+" ("+dup.officeName+")"); return; }
    setRegBusy(true);
    try{
      const oid=reg.officeId||office.id;
      const rec={ empId:id, fullName:nm, position:reg.position.trim(), department:"",
                  selfAdded:true, addedAt:nowTs() };
      const ref=await R("offices/"+oid+"/people").push(rec);
      setWho({ id:ref.key, ...rec, homeOfficeId:oid });
      setPickName(nm); setReg(null); setErr("");
    }catch(e){ setRegErr(dbErr(e,"บันทึกรายชื่อ")); }
    setRegBusy(false);
  };

  useEffect(()=>{
    if(done) window.scrollTo(0,0);       /* ให้เห็นแถบเขียว "ทำรายการสำเร็จ" ก่อนเสมอ */
  },[done]);

  const pickPhoto=(f)=>{
    setPhoto(f); setErr("");
    const r=new FileReader(); r.onload=()=>setPreview(String(r.result)); r.readAsDataURL(f);
  };

  const confirm=async()=>{
    if(!who||!cart.length) return;
    if(REQUIRE_PHOTO && !photo){ setErr("กรุณาแนบรูปถ่ายเป็นหลักฐานก่อนยืนยัน"); return; }
    if(typeof navigator!=="undefined" && navigator.onLine===false){
      setErr("ไม่มีสัญญาณอินเทอร์เน็ต — เชื่อมต่อแล้วกดยืนยันอีกครั้ง (รายการที่เลือกไว้ยังอยู่ครบ)"); return; }
    setBusy(true); setErr("");
    try{
      /* อัปโหลดรูปก่อน — ถ้าอัปไม่สำเร็จจะไม่ตัดสต๊อก */
      let ph=null;
      if(photo){
        setStage("กำลังอัปโหลดรูปหลักฐาน…");
        ph=await driveUpload(photo, "เบิกจ่าย/"+office.name+"/"+monthFolder(),
              "เบิก_"+(who.empId||"-")+"_"+Date.now());
      }
      setStage("กำลังบันทึกการเบิก…");
      /* ตัดสต๊อกแบบ transaction กันชนกันเมื่อมีหลายคนเบิกพร้อมกัน */
      for(const it of cart){
        const res=await R("offices/"+office.id+"/stock/"+it.sku+"/qty").transaction(cq=>{
          if(cq===null) return cq;
          if(cq < it.qty) return;               // ยกเลิก — ของไม่พอ
          return cq - it.qty;
        });
        if(!res.committed) throw new Error("ของไม่พอสำหรับ "+fullLabel(it)+" — กรุณาลองใหม่");
      }
      const rec={ officeId:office.id, empId:who.empId||"", name:censorName(who.fullName),
                  position:who.position||"", items:cart, qty:cart.reduce((s,i)=>s+i.qty,0),
                  date:todayISO(), ts:nowTs(), photo:ph };
      if(who.homeOfficeId && who.homeOfficeId!==office.id) rec.homeOfficeId=who.homeOfficeId;
      const pushed = await R("withdrawals").push(rec);
      const refNo = String(pushed.key||"").replace(/[^A-Za-z0-9]/g,"").slice(-6).toUpperCase();
      setDone({ ...rec, refNo, fullName:who.fullName, shot:preview, homeName:OFC[who.homeOfficeId]||"" });
      setCart([]); setPhoto(null);
    }catch(e){ setErr((e.message||"บันทึกไม่สำเร็จ")+" · รายการและรูปที่เลือกไว้ยังอยู่ครบ กดยืนยันใหม่ได้เลย"); }
    setStage(""); setBusy(false);
  };

  if(!ready) return <Loading t="กำลังเชื่อมต่อคลัง…"/>;

  if(done){
    const totQty = done.items.reduce((a,i)=>a+(i.qty||0),0);
    const row = (k,v) => (<div style={{display:"flex",gap:12,padding:"5px 0"}}>
      <span style={{width:74,flex:"none",color:"var(--ink-3)",fontSize:12.5}}>{k}</span>
      <span style={{flex:1,minWidth:0,fontWeight:500,fontSize:13.5}}>{v}</span></div>);
    return (<Shell title="ทำรายการสำเร็จ" sub={office.name}>
      <div style={{maxWidth:480,margin:"18px auto 0"}}>

        {/* หัวสลิป */}
        <div style={{background:"var(--ok)",color:"#fff",borderRadius:"14px 14px 0 0",
          padding:"20px 22px 18px",textAlign:"center"}}>
          <div style={{width:50,height:50,borderRadius:99,background:"rgba(255,255,255,.2)",
            display:"grid",placeItems:"center",margin:"0 auto 10px"}}><Ic n="check" s={28}/></div>
          <div style={{fontSize:23,fontWeight:700,letterSpacing:"-.01em"}}>ทำรายการสำเร็จ</div>
          <div style={{marginTop:9,background:"rgba(255,255,255,.22)",borderRadius:9,

            โปรดแสดงหน้าจอนี้ให้เจ้าหน้าที่</div>
          <div className="mono" style={{marginTop:12,display:"inline-block",background:"rgba(255,255,255,.18)",
            borderRadius:99,padding:"5px 16px",fontSize:15,letterSpacing:".08em",fontWeight:500}}>

        </div>

        <div style={{background:"#fff",border:"1px solid var(--line)",borderTop:"none",
          borderRadius:"0 0 14px 14px",padding:"18px 22px 20px"}}>

          <div className="lbl" style={{marginBottom:8}}>รายการที่เบิก</div>
          {done.items.map((it,i)=>(<div key={i} style={{display:"flex",alignItems:"flex-start",gap:12,
            padding:"9px 0",borderBottom:i<done.items.length-1?"1px solid var(--line-2)":"none"}}>
            <span style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:14.5}}>{it.itemName}</div>
              {(it.subType||it.size) && <div className="hint">{it.subType}
                {it.subType&&it.size?" · ":""}
                {it.size&&(it.variant==="color"?it.size:"ไซส์ "+it.size)}</div>}
            </span>
            <span className="chip g" style={{whiteSpace:"nowrap",fontSize:13.5,fontWeight:600}}>
              {it.qty} {it.unit}</span>
          </div>))}

          <div style={{display:"flex",justifyContent:"space-between",marginTop:12,padding:"10px 14px",
            background:"var(--ok-soft)",borderRadius:8,fontWeight:600,fontSize:14}}>
            <span>รวมทั้งสิ้น</span>
            <span className="mono">{done.items.length} รายการ · {totQty} ชิ้น</span>
          </div>

          <div className="hr" style={{margin:"16px 0 10px"}}></div>
          <div className="lbl" style={{marginBottom:6}}>ข้อมูลผู้เบิก</div>
          {row("ผู้เบิก", done.fullName||done.name)}
          {row("รหัสประจำตัว", <span className="mono">{done.empId||"—"}</span>)}
          {row("คลังที่เบิก", office.name)}
          {done.homeOfficeId && row("ต้นสังกัด",
            <span className="chip w">{done.homeName||OFC[done.homeOfficeId]}</span>)}
          {row("วันเวลา", <span className="mono">{thDateTime(done.ts)}</span>)}

          {(done.shot || (done.photo&&safeUrl(done.photo.thumb))) && <>
            <div className="hr" style={{margin:"16px 0 10px"}}></div>
            <div className="lbl" style={{marginBottom:8}}>รูปหลักฐานการเบิก</div>

          {done.photo && safeUrl(done.photo.view) && <a className="btn neutral block" href={safeUrl(done.photo.view)}

          <button className="btn block" style={{marginTop:10}}

        </div>
      </div>
    </Shell>);
  }

  const stDone=[!!who, cart.length>0, !!photo, false];
  const stNow = !who ? 0 : (cart.length===0 ? 1 : (!photo && REQUIRE_PHOTO ? 2 : 3));
  const STEP_LABELS=["ผู้เบิก","เลือกของ","ถ่ายรูป","ยืนยัน"];

  return (<div>

        <div className="wrow">
          <div className="wmk"><Ic n="bolt" s={22}/></div>

        <div className="sec-head" style={{margin:"0 0 12px"}}>

              emptyText="ไม่พบรหัส/ชื่อนี้ — ติดต่อผู้ดูแลคลังของหน่วยงาน"

                <span className="mono" style={{fontSize:12,color:"var(--plum-700)",minWidth:62}}>{o.empId||"—"}</span>
                <span><div style={{fontWeight:600}}>{o.label}</div>
                  <small>{o.position||""}{o.position&&o.officeId!==office.id?" · ":""}
                    {o.officeId!==office.id
                      ? <b style={{color:"var(--warn)"}}>{o.officeName}</b>
                      : (o.department||"")}</small></span>
              </div>)}/>
            <button className="btn neutral sm" style={{marginTop:10}}
              onClick={()=>{ setRegErr(""); setReg({empId:"",fullName:"",position:"",officeId:office.id}); }}>

          </>}
      </div>

      {/* ขั้นที่ 2 — เลือกของ */}
      {who && <div className={"stepcard"+(stNow===1?" on":" mut")}>

        {groups.length===0
          ? <Empty icon="box" title="ไม่มีของคงเหลือในคลัง" desc="ติดต่อผู้ดูแลคลังของหน่วยงาน"/>
          : <>
            <label className="lbl">ค้นหารายการ</label>
